site_name: Limen, spiegato per gradi
site_description: Il libro di Limen, dalle librerie al cuore del sistema
repo_url: https://github.com/agent-engineering-studio/limen
edit_uri: edit/main/docs/book/
docs_dir: docs/book
site_dir: site
strict: true

theme:
  name: material
  language: it
  features:
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy

nav:
  - Introduzione e indice: index.md
  - 1. Il problema e cosa fa Limen: 01-il-problema.md
  - 2. I mattoni, le librerie: 02-le-librerie.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
