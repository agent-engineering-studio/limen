; Firmware di esempio per un sensore dei cittadini di Limen (#256, epic #247).
;
; Un solo sorgente, tre sensori: si sceglie con l'ambiente.
;
;   pio run -e pluviometro -t upload
;   pio device monitor
;
; Nel binario non c'è nessun segreto: rete, id e certificati si danno dalla
; seriale (scrivi `aiuto`) e restano nella memoria del dispositivo. La CI
; compila tutti e tre gli ambienti (.github/workflows/firmware.yml).

[platformio]
default_envs = pluviometro

[env]
; Arduino-ESP32 2.0.x (ESP-IDF 4.4): il client MQTT di ESP-IDF fa QoS 1,
; last will e mTLS, cose che PubSubClient non fa tutte.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:pluviometro]
build_flags = ${env.build_flags} -DLIMEN_PLUVIOMETRO

[env:umidita_suolo]
build_flags = ${env.build_flags} -DLIMEN_UMIDITA_SUOLO

[env:idrometro]
build_flags = ${env.build_flags} -DLIMEN_IDROMETRO
