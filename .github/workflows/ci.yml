name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Un tag vX.Y.Z pubblica le immagini anche con la versione (#303).
    tags: ["v*"]

# Cancel superseded runs on the same branch so PR pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate rapido — lint + tipi + test unitari. Deve restare sotto i dieci
  # minuti: e' quello che dice "questa PR e' sana" mentre chi l'ha aperta sta
  # ancora guardando (#90).
  # ---------------------------------------------------------------------------
  backend:
    name: backend (lint + mypy + unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.13"
          enable-cache: true

      - name: Install Python + deps
        run: |
          uv python install 3.12
          uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Ruff (format check)
        run: uv run ruff format --check src tests

      - name: mypy --strict
        run: uv run mypy

      - name: pytest (unit)
        run: uv run pytest tests/unit -q --durations=10

  # ---------------------------------------------------------------------------
  # Suite completa con la soglia di copertura. Budget suo, perche' i test di
  # integrazione avviano un PostGIS via testcontainers e non staranno mai nei
  # tempi del gate rapido. Esclude i `slow` (vedi il job dopo).
  # ---------------------------------------------------------------------------
  integration:
    name: integration (pytest, cov ≥ 80%)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.13"
          enable-cache: true

      - name: Install Python + deps
        run: |
          uv python install 3.12
          uv sync --all-groups

      - name: pytest with coverage gate
        run: uv run pytest --cov=limen --cov-report=term-missing -q --durations=10

  # ---------------------------------------------------------------------------
  # I test lenti: seminano le venti regioni (~312.000 celle). Solo su `main`,
  # perche' verificano che il seme nazionale regga — un fatto che cambia di
  # rado e che non vale il tempo di ogni PR.
  # ---------------------------------------------------------------------------
  slow:
    name: slow (seme nazionale)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.13"
          enable-cache: true

      - name: Install Python + deps
        run: |
          uv python install 3.12
          uv sync --all-groups

      - name: pytest -m slow
        run: uv run pytest -m slow -q --durations=10

  # ---------------------------------------------------------------------------
  # Frontend — ESLint + Vitest + production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (lint + vitest + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Vite build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Immagini del progetto — buildx, push su GHCR su main e sui tag (#303).
  # Un server nuovo le tira con LIMEN_IMAGE_PREFIX + LIMEN_IMAGE_TAG invece di
  # costruirle: api (anche worker e mcp), postgres, web, geodata.
  # ---------------------------------------------------------------------------
  docker:
    name: docker (${{ matrix.immagine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [backend, integration, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - immagine: api
            context: .
            file: infra/docker/Dockerfile.api
            build-args: ""
          - immagine: postgres
            context: infra/postgres
            file: infra/postgres/Dockerfile.db
            build-args: ""
          # La SPA pubblicata chiama API, tile e WMS sulla stessa origine (`/`,
          # `/tiles`, `/geoserver/ispra/wms` dietro il reverse proxy): Vite
          # scrive gli URL nel bundle, un'altra disposizione costruisce la sua.
          - immagine: web
            context: frontend
            file: frontend/Dockerfile
            build-args: |
              BASE_PATH=/
              VITE_API_URL=/
              VITE_TILESERV_URL=/tiles
              VITE_GEOSERVER_WMS_URL=/geoserver/ispra/wms
              VITE_DEFAULT_LON=12.6
              VITE_DEFAULT_LAT=41.9
              VITE_DEFAULT_ZOOM=5.3
          - immagine: geodata
            context: .
            file: geodata/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/limen-${{ matrix.immagine }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+ push on main and tags)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.immagine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.immagine }}

      - name: Smoke test — `limen` is on the PATH
        if: github.event_name != 'push' && matrix.immagine == 'api'
        run: docker run --rm "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" limen --version
