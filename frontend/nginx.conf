# nginx vhost for the Limen SPA image (see Dockerfile).
#
# The bundle is always served from the server ROOT here. When it is deployed
# under a path prefix, the reverse proxy strips that prefix before forwarding
# — the prefix only has to be baked into the asset URLs, which is what
# `vite build --base=` does.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed filenames: safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry document must never be cached, or a deploy keeps serving the
    # old bundle's asset references.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Routing is hash-based (`#/dashboard`), so the server only ever sees `/`.
    # The fallback covers direct hits on any other path.
    # Le tile del rilievo (#318), montate dal compose da LIMEN_DEM_TILES_DIR.
    # Un file che manca è un 404, non il ripiego della SPA qui sotto: la SPA
    # chiede questo percorso per sapere se il rilievo c'è, e un index.html
    # con 200 lo accenderebbe su un file che non esiste. Le Range, che il
    # PMTiles usa per leggere a pezzi, nginx le serve da sé.
    location /rilievo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
