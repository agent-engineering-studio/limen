# nginx vhost for the Limen SPA image (see Dockerfile).
#
# The bundle is always served from the server ROOT here. When it is deployed
# under a path prefix, the reverse proxy strips that prefix before forwarding
# — the prefix only has to be baked into the asset URLs, which is what
# `vite build --base=` does.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed filenames: safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry document must never be cached, or a deploy keeps serving the
    # old bundle's asset references.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Routing is hash-based (`#/dashboard`), so the server only ever sees `/`.
    # The fallback covers direct hits on any other path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
