# Broker dei sensori (#260). Separato da `limen-mosquitto`, quello delle
# allerte: quello accetta connessioni anonime sul loopback, questo e' esposto
# su Internet e non accetta nessuno senza un certificato firmato dalla CA dei
# sensori.

listener 8883
protocol mqtt

# L'identita' e' il CN del certificato, mai un campo del payload: e' quello
# che rende inutile copiare l'id di un altro dispositivo.
require_certificate true
use_identity_as_username true
allow_anonymous false

cafile /mosquitto/broker/ca.crt
certfile /mosquitto/broker/server.crt
keyfile /mosquitto/broker/server.key
# Una CRL scaduta fa rifiutare TUTTI i client, non solo i revocati: va
# rigenerata prima di `nextUpdate` (`make sensori-crl`, e `sensori-check`
# avvisa sotto i 30 giorni).
crlfile /mosquitto/broker/crl.pem
tls_version tlsv1.2

acl_file /mosquitto/broker/acl

# Una SenML con poche misure sta in qualche centinaio di byte.
max_packet_size 4096
max_connections 5000
# nginx chiude una connessione TCP inattiva dopo `proxy_timeout` (15 min):
# il keepalive deve restare sotto, o i dispositivi cadrebbero a ogni ciclo.
max_keepalive 600
max_queued_messages 1000

# Le sessioni QoS 1 dell'ingestore sopravvivono a un riavvio del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
