# Local-dev stack for Limen.
#
# Just Postgres 16 + PostGIS 3.5 (+ pg_cron + pgvector). All other Limen
# services run on the host via `uv run …` while we iterate.
#
# If you want to point Limen at Neon instead, do NOT start this compose
# stack — just set DB__CONNECTION_STRING in your .env to the Neon DSN
# (sslmode=require) and SCHEDULER__CACHE_CLEANUP=apscheduler.
#
# LIMEN_PGDATA_DIR moves the cluster off the Docker volume (which lives on
# whatever filesystem backs /var/lib/docker) onto a path you choose — set it
# to an absolute directory on your fastest disk. Postgres commits are
# fsync-bound, so on a host whose /var/lib/docker sits on spinning disks
# this is the single biggest lever on write throughput: measured on the
# dedicated server, fdatasync runs at 76 ops/s on the HDD array vs
# 884 ops/s on NVMe. Unset ⇒ the named volume, i.e. no change.

name: limen

services:
  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile.db
    image: limen/postgres:16-3.5
    container_name: limen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen
      POSTGRES_DB: limen
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ${LIMEN_PGDATA_DIR:-limen-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limen -d limen"]
      interval: 5s
      timeout: 5s
      retries: 20
      # After an unclean stop Postgres fsyncs every file in the data
      # directory before recovery starts, and it will not accept
      # connections until that finishes. On fast storage that is seconds;
      # on a degraded array it can be tens of minutes (measured on the
      # dedicated server: ~2 s per file over 1267 files). Failures inside
      # start_period don't count against `retries`, so raise
      # LIMEN_PG_START_PERIOD there rather than watch `depends_on` give up
      # on a database that was merely still starting.
      start_period: ${LIMEN_PG_START_PERIOD:-10s}

volumes:
  limen-pgdata:
    name: limen-pgdata
