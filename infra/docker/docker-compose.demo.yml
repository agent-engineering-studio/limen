# Full demo stack: Postgres + PostGIS + Limen API.
#
# Brings up the database and the FastAPI app in a single command:
#
#     docker compose -f infra/docker/docker-compose.demo.yml up -d --build
#
# The API points at the local Postgres by default. To target Neon
# instead, override DB__CONNECTION_STRING (and keep
# SCHEDULER__CACHE_CLEANUP=apscheduler) — no other change needed:
#
#     DB__CONNECTION_STRING="postgresql://...neon.tech/...?sslmode=require" \
#     docker compose -f infra/docker/docker-compose.demo.yml up -d --build api

name: limen-demo

services:
  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile.db
      args:
        # Upstream postgis/postgis has no arm64 manifest; the Makefile passes
        # the multi-arch imresamu image on Apple Silicon. Default keeps amd64.
        POSTGIS_BASE: ${POSTGIS_BASE:-postgis/postgis:16-3.5}
    # Costruita qui, oppure tirata da GHCR con LIMEN_IMAGE_PREFIX e
    # LIMEN_IMAGE_TAG (#303): vedi «Immagini» nel README.
    image: ${LIMEN_IMAGE_PREFIX:-limen/}postgres:${LIMEN_IMAGE_TAG:-16-3.5}
    container_name: limen-postgres
    restart: unless-stopped
    # SIGINT = "fast shutdown": Postgres chiude le connessioni, fa un
    # checkpoint e esce pulito. Il SIGTERM di default e' lo "smart shutdown",
    # che **aspetta** che i client si scolleghino: con l'API attaccata non
    # finisce mai, dopo 10 s arriva il SIGKILL e il cluster riparte come dopo
    # un crash. Su questo hardware quel recovery e' un fsync dell'intera
    # cartella dati: misurato oltre 10 minuti su 25 GB.
    stop_signal: SIGINT
    stop_grace_period: 5m
    # Parallel workers on national-scale aggregations (312k cells) blow
    # through Docker's 64 MB /dev/shm default → DiskFullError.
    shm_size: 1gb
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen
      POSTGRES_DB: limen
      PGDATA: /var/lib/postgresql/data/pgdata
    # Docker publishes ports by writing its OWN iptables chains, which are
    # consulted BEFORE ufw's — so the host's `default deny incoming` does not
    # protect a published port. Bind defaults to loopback; override the
    # variable (to 0.0.0.0 or a specific interface) only with something in
    # front of it.
    # Host-side `uv run limen migrate/seed/...` connects here (see
    # DB__CONNECTION_STRING in .env.example), so the port stays published —
    # just not to the LAN.
    ports:
      - "${LIMEN_PG_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ${LIMEN_PGDATA_DIR:-limen-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limen -d limen"]
      interval: 5s
      timeout: 5s
      retries: 20
      # After an unclean stop Postgres fsyncs every file in the data
      # directory before recovery starts, and it will not accept
      # connections until that finishes. On fast storage that is seconds;
      # on a degraded array it can be tens of minutes (measured on the
      # dedicated server: ~2 s per file over 1267 files). Failures inside
      # start_period don't count against `retries`, so raise
      # LIMEN_PG_START_PERIOD there rather than watch `depends_on` give up
      # on a database that was merely still starting.
      start_period: ${LIMEN_PG_START_PERIOD:-10s}

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ${LIMEN_IMAGE_PREFIX:-limen/}api:${LIMEN_IMAGE_TAG:-0.1}
    container_name: limen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-env
      # Override these via the shell to point at Neon or a managed PG.
      DB__CONNECTION_STRING: postgresql://limen:limen@postgres:5432/limen
      OBJECT_STORE__BACKEND: filesystem
      OBJECT_STORE__ROOT: /var/lib/limen/objects
      SCHEDULER__CACHE_CLEANUP: apscheduler
      # I job vivono nel container `worker` (#77). Qui l'API è HTTP puro:
      # prima, uno sweep nazionale e le richieste della mappa condividevano
      # un solo event loop, e l'API andava in timeout durante lo sweep.
      SCHEDULER__ENABLED: "false"
      API__HOST: 0.0.0.0
      API__PG_TILESERV_URL: http://pg_tileserv:7800
      DB__TILES_PASSWORD: ${DB__TILES_PASSWORD:-}
      # Notifications — listing a channel here enables it; channels
      # whose creds are missing degrade to a no-op rather than erroring.
      # NOTIFICATIONS__ENABLED_CHANNELS: '["mqtt"]'
      # Istanza Open-Meteo propria (#142). Vuote ⇒ API pubblica, com'era.
      # Il profilo compose `meteo` ha un progetto suo ma si attacca a QUESTA
      # rete, quindi l'indirizzo è `http://openmeteo:8080/...`. La porta 8085
      # sul loopback dell'host serve a `make meteo-check`, non a noi: da un
      # container `host.docker.internal` risolve al gateway, non al loopback.
      OPENMETEO__FORECAST_URL: ${OPENMETEO__FORECAST_URL:-}
      OPENMETEO__ARCHIVE_URL: ${OPENMETEO__ARCHIVE_URL:-}
      OPENMETEO__MODELS: ${OPENMETEO__MODELS:-}
      # Previsione GloFAS dall'EWDS di Copernicus. Vuota ⇒ resta Open-Meteo.
      COPERNICUS__EWDS_KEY: ${COPERNICUS__EWDS_KEY:-}
      # Chiave di servizio CLMS (JSON su una riga): il passo notturno sa
      # quando esce una release EGMS. Vuota ⇒ il passo si salta.
      EGMS__SERVICE_KEY: ${EGMS__SERVICE_KEY:-}
      EGMS__RELEASE: ${EGMS__RELEASE:-2020_2024}
      # Archivio del radar DPC «Merging»: deve stare sul volume dei dataset
      # (/var/lib/limen/datasets). Vuota ⇒ il passo notturno si salta.
      RADAR_ARCHIVE__CARTELLA: ${RADAR_ARCHIVE__CARTELLA:-}
      RADAR_ARCHIVE__GIORNI: ${RADAR_ARCHIVE__GIORNI:-160}
      RADAR_ARCHIVE__FILE_PER_NOTTE: ${RADAR_ARCHIVE__FILE_PER_NOTTE:-1500}
      NOTIFICATIONS__MQTT__BROKER_HOST: mosquitto
      NOTIFICATIONS__MQTT__BROKER_PORT: "1883"
      NOTIFICATIONS__MQTT__TOPIC: limen/alerts
      ALERT__MIN_LEVEL: High
      ALERT__DEDUP_WINDOW_MINUTES: "180"
      ALERT__MAP_BASE_URL: ${ALERT__MAP_BASE_URL:-http://localhost:5173}
      # Posta: la usano i contributi degli esperti (e il canale email delle
      # allerte, se lo si abilita). Vuote ⇒ il modulo risponde che il
      # contributo non è partito; niente si salva comunque.
      NOTIFICATIONS__EMAIL__SMTP_HOST: ${NOTIFICATIONS__EMAIL__SMTP_HOST:-}
      NOTIFICATIONS__EMAIL__SMTP_PORT: ${NOTIFICATIONS__EMAIL__SMTP_PORT:-587}
      NOTIFICATIONS__EMAIL__USE_TLS: ${NOTIFICATIONS__EMAIL__USE_TLS:-false}
      NOTIFICATIONS__EMAIL__USE_STARTTLS: ${NOTIFICATIONS__EMAIL__USE_STARTTLS:-true}
      NOTIFICATIONS__EMAIL__USERNAME: ${NOTIFICATIONS__EMAIL__USERNAME:-}
      NOTIFICATIONS__EMAIL__PASSWORD: ${NOTIFICATIONS__EMAIL__PASSWORD:-}
      NOTIFICATIONS__EMAIL__FROM_ADDRESS: ${NOTIFICATIONS__EMAIL__FROM_ADDRESS:-}
      CONTRIBUTI__DESTINATARI: ${CONTRIBUTI__DESTINATARI:-[]}
      CONTRIBUTI__MAX_PER_IP_ORA: ${CONTRIBUTI__MAX_PER_IP_ORA:-3}
      CONTRIBUTI__MAX_TOTALI_ORA: ${CONTRIBUTI__MAX_TOTALI_ORA:-30}
      CONTRIBUTI__SECONDI_MINIMI: ${CONTRIBUTI__SECONDI_MINIMI:-5}
      # Ruolo ristretto dell'ingestore (#267): l'API ne imposta la password, il
      # worker la usa. Vuota ⇒ il ruolo del worker.
      IOT__CITTADINI__DB_PASSWORD: ${IOT__CITTADINI__DB_PASSWORD:-}
      # Modulo di registrazione dei sensori (#253): chiuso finché non lo si
      # apre. Le richieste vanno a CONTRIBUTI__DESTINATARI; si approvano
      # dall'host con `uv run limen sensore approva`.
      IOT__CITTADINI__REGISTRAZIONE__APERTA: ${IOT__CITTADINI__REGISTRAZIONE__APERTA:-false}
      IOT__CITTADINI__REGISTRAZIONE__MAX_DISPOSITIVI_PER_REGISTRANTE: ${IOT__CITTADINI__REGISTRAZIONE__MAX_DISPOSITIVI_PER_REGISTRANTE:-3}
      IOT__CITTADINI__REGISTRAZIONE__MAX_PER_IP_ORA: ${IOT__CITTADINI__REGISTRAZIONE__MAX_PER_IP_ORA:-3}
      IOT__CITTADINI__REGISTRAZIONE__MAX_TOTALI_ORA: ${IOT__CITTADINI__REGISTRAZIONE__MAX_TOTALI_ORA:-20}
      API__PORT: "8080"
      LOG_JSON: "true"
      # Optional LLM credentials. The provider is pinned below
      # (LLM__PROVIDER), so setting a key here is not enough on its own —
      # switch LLM__PROVIDER too, and only with the `agents` group installed.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # OPENAI_API_KEY:    ${OPENAI_API_KEY}
      # V2.x — KG advisory grounding. OFF by default. The sidecar is NOT a
      # service of this compose (see the note where it used to be, further
      # down): it runs from its own repo. Default points at its kg-api on the
      # host — host.docker.internal, never 127.0.0.1, which inside a container
      # is the container itself. API_-prefixed override so a host-side value in
      # .env never leaks in here.
      KG__ENABLED: ${KG__ENABLED:-false}
      KG__BASE_URL: ${API_KG_BASE_URL:-http://host.docker.internal:8000}
      KG__THREAD_ID: landslide-kb
      KG__TIMEOUT_SECONDS: "3.0"
      KG__CACHE_TTL_SECONDS: "3600"
      # GeoServer PostGIS as the authoritative ISPRA static-data source.
      # Resolves by service name on the merged `make up` network. Uses an
      # API_-prefixed override so the host-side GEOSERVER_SOURCE__DB_DSN in
      # .env (localhost:55433, for host `uv run`) never leaks in here.
      GEOSERVER_SOURCE__DB_DSN: ${API_GEOSERVER_SOURCE_DSN:-postgresql://gis:gis@geoserver-postgis:5432/gis}
      # DTM path INSIDE the container (the shared /data folder is mounted
      # below). Distinct from the host-side LIMEN_DEM_RASTER so a host path
      # never leaks into the container. Empty ⇒ in-container DEM step is a
      # no-op; the heavy DTM slope bootstrap normally runs on the host.
      # Set API_DEM_RASTER=/data/HRDTM5m.tif to enable it in-container.
      LIMEN_DEM_RASTER: ${API_DEM_RASTER:-}
      # LLM backend — self-hosted gateway | host Ollama | Ollama Cloud | Claude.
      #   gateway:      LLM__LLAMACPP_BASE_URL=http://host.docker.internal:8091
      #   host Ollama:  LLM__PROVIDER=ollama + LLM__OLLAMA_BASE_URL=...:11434
      #   Ollama Cloud: LLM__PROVIDER=ollama + https://ollama.com + API key
      #   Claude:       ANTHROPIC_API_KEY (or LLM__PROVIDER=anthropic)
      # The provider is PINNED here rather than autodetected: the image ships
      # the anthropic SDK (`agents` group) for the faithfulness reviewer, and
      # the ANTHROPIC_API_KEY it needs must not turn every role into Claude.
      #
      # Default is `llamacpp` — the LiteLLM gateway. It used to be `ollama`,
      # from when a host Ollama on :11434 was the only local engine; that pin
      # now contradicts both the code's documented fallback order and the
      # actual host, where nothing listens on 11434. Both defaults fail the
      # same way when their engine is absent (connection refused → the
      # non-authoritative LLM path degrades to the deterministic text, which
      # is the invariant), so the tie-breaker is which one is right when the
      # engine IS present.
      LLM__PROVIDER: ${LLM__PROVIDER:-llamacpp}
      # Host-Ollama URL differs host vs container, so use an API_-prefixed
      # override (defaults to host.docker.internal). Ollama Cloud / Anthropic
      # need no such split — the key/base are identical everywhere.
      LLM__OLLAMA_BASE_URL: ${API_LLM_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM__OLLAMA_MODEL: ${LLM__OLLAMA_MODEL:-qwen3.6:latest}
      # Self-hosted inference server on the host (aes-inference-lab). The
      # base URL is the LiteLLM gateway, not llama-swap directly: routing by
      # model name, budget cap and the local->cloud fallback all live there,
      # and a direct port bypasses them. No /v1 suffix — the client appends
      # /v1/chat/completions itself. Same host-vs-container split as Ollama,
      # hence the API_-prefixed override.
      LLM__LLAMACPP_BASE_URL: ${API_LLM_LLAMACPP_BASE_URL:-http://host.docker.internal:8091}
      # Gateway model name, not a file: 'chat' is Qwen3-8B, the one picked
      # for Italian prose. 'fast' is the 4B, 'extract' the JSON profile.
      LLM__LLAMACPP_MODEL: ${LLM__LLAMACPP_MODEL:-chat}
      LLM__LLAMACPP_API_KEY: ${LLM__LLAMACPP_API_KEY:-}
      # Dove scrivono i comandi CLI: cataloghi in cache e report dei backtest.
      LIMEN_DATA_DIR: /var/lib/limen/datasets
      LIMEN_REPORTS_DIR: /var/lib/limen/reports
      # Ceiling for roles with no per-role override. Sized for the GPU-resident
      # gateway models on NVMe (a swap is seconds). Was 900 s, from when the
      # GGUFs lived on spinning disk; that high a ceiling now only delays the
      # moment you notice the engine is broken.
      LLM__LLAMACPP_TIMEOUT_SECONDS: ${LLM__LLAMACPP_TIMEOUT_SECONDS:-120}
      # Per-role ceiling, JSON keyed by agent-role label. Only needed for a
      # role deliberately pointed at a slow model — which today no role may be
      # (see LLM__MODELS__* below).
      LLM__LLAMACPP_ROLE_TIMEOUT_SECONDS: ${LLM__LLAMACPP_ROLE_TIMEOUT_SECONDS:-{}}
      # Per-role model routing. These are GATEWAY model names (keys in its
      # model_list), not file names — which is what makes a per-role map
      # possible at all. Only the roles set here reach the local engine; the
      # rest fall back to LLM__LLAMACPP_MODEL, because the code defaults are
      # Claude ids the gateway would reject.
      #
      # Only RiskAnalyst and Briefing are wired to an executor today
      # (agents/workflows/main_workflow.py); the other three are declared
      # config with no call site yet.
      #
      # RiskAnalyst emits strict JSON validated by Pydantic, so it gets
      # `extract` (the JSON-grammar profile) rather than the general-purpose
      # 4B. Briefing writes 150-250 words of Italian prose → `chat` (8B).
      LLM__MODELS__RISK_ANALYST: ${LLM__MODELS__RISK_ANALYST:-extract}
      LLM__MODELS__BRIEFING: ${LLM__MODELS__BRIEFING:-chat}
      LLM__MODELS__ORCHESTRATOR: ${LLM__MODELS__ORCHESTRATOR:-fast}
      LLM__MODELS__SCORER: ${LLM__MODELS__SCORER:-fast}
      LLM__MODELS__SUMMARIZER: ${LLM__MODELS__SUMMARIZER:-fast}
      # The evening faithfulness reviewer (docs/inference.md): a Claude id,
      # sent straight to the Message Batches API with ANTHROPIC_API_KEY, not
      # through the gateway. Empty = off.
      LLM__MODELS__FEDELTA: ${LLM__MODELS__FEDELTA:-}
      LLM__FEDELTA_CAMPIONE: ${LLM__FEDELTA_CAMPIONE:-4}
      LLM__FEDELTA_ORA_UTC: ${LLM__FEDELTA_ORA_UTC:-21}
      LLM__FEDELTA_ATTESA_MASSIMA_MINUTI: ${LLM__FEDELTA_ATTESA_MASSIMA_MINUTI:-120}
      # La raccolta quotidiana degli eventi dalla stampa (#347), anche lei in
      # batch all'API di Claude con ANTHROPIC_API_KEY. Vuota = spenta.
      LLM__MODELS__EVENTI: ${LLM__MODELS__EVENTI:-}
      LLM__EVENTI_ORA_UTC: ${LLM__EVENTI_ORA_UTC:-6}
      LLM__EVENTI_GIORNI: ${LLM__EVENTI_GIORNI:-3}
      # Champion/challenger: shadow runs the ML model in parallel (writes
      # model_runs only; alerts stay with the deterministic champion).
      SCORING__MODE: ${SCORING__MODE:-champion_only}
      # Event-driven predictive sweep (forecast rain → predictive alerts).
      FORECAST__ENABLED: ${FORECAST__ENABLED:-true}
      FORECAST__HORIZON_HOURS: ${FORECAST__HORIZON_HOURS:-48}
      FORECAST__INTERVAL_HOURS: ${FORECAST__INTERVAL_HOURS:-6}
      FORECAST__MIN_LEVEL: ${FORECAST__MIN_LEVEL:-High}
      # DPC radar nowcast trigger (SRI 1 km / 5 min, CC-BY-SA).
      NOWCAST__ENABLED: ${NOWCAST__ENABLED:-true}
      NOWCAST__INTERVAL_MINUTES: ${NOWCAST__INTERVAL_MINUTES:-15}
      NOWCAST__MIN_INTENSITY_MMH: ${NOWCAST__MIN_INTENSITY_MMH:-30}
      REPORT__ENABLED: ${REPORT__ENABLED:-true}
      REPORT__HOUR_UTC: ${REPORT__HOUR_UTC:-6}
      # Registry su Postgres, non su SQLite (#78): il file store è deprecato e
      # il registry dei modelli non ci funziona, quindi il cancello di
      # promozione non avrebbe dove scrivere. Il database `mlflow` lo crea
      # l'API all'avvio se manca (anche su un cluster ripristinato, #327).
      # sqlite resta il default solo per lo sviluppo locale.
      SCORING__MLFLOW_TRACKING_URI: ${SCORING__MLFLOW_TRACKING_URI:-postgresql://limen:limen@postgres:5432/mlflow}
      # Gli artefatti degli esperimenti nuovi, nel volume ${LIMEN_DATA_ROOT}/mlruns
      # montato qui sotto (#302): prima il percorso del Mac dell'autore.
      SCORING__MLFLOW_ARTIFACT_ROOT: ${SCORING__MLFLOW_ARTIFACT_ROOT:-file:///var/lib/limen/mlruns}
      LLM__OLLAMA_API_KEY: ${LLM__OLLAMA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # So host.docker.internal (the inference gateway on the host) resolves on
      # Linux too. 127.0.0.1 inside a container is the container itself.
      - "host.docker.internal:host-gateway"
    # Public surface, but published to loopback: put a reverse proxy on 443
    # in front rather than exposing 8080 directly. See the postgres note above
    # for why ufw is not the control here.
    ports:
      - "${LIMEN_API_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - limen-objects:/var/lib/limen/objects
      # Cataloghi scaricati (e-ITALICA, archivi FIRMS, mosaici) e report dei
      # backtest. Senza questi due l'immagine non ha dove scrivere: la
      # directory di lavoro e' di root, il processo gira come `limen`, e i
      # comandi morivano su "Permission denied" dopo aver lavorato per minuti.
      - ${LIMEN_DATASETS_DIR:-${LIMEN_DATA_ROOT:-../../data}/datasets}:/var/lib/limen/datasets
      - ${LIMEN_REPORTS_HOST_DIR:-${LIMEN_DATA_ROOT:-../../data}/reports}:/var/lib/limen/reports
      # DTM / shared vector data (read-only). Same folder GeoServer serves.
      - ${GEOSERVER_SHAPEFILE_DIR:-${LIMEN_DATA_ROOT:-../../data}/geoserver}:/data:ro
      # Gli **artefatti** del challenger. Il registry sta su Postgres (#78) e
      # salva URI assoluti al momento del log: gli esperimenti nuovi scrivono
      # in /var/lib/limen/mlruns (SCORING__MLFLOW_ARTIFACT_ROOT), uguale su ogni
      # host (#302; prima era il percorso del Mac dell'autore). rw perché il
      # caricamento del modello scrive registered_model_meta nella cartella
      # dell'artefatto. File mancanti ⇒ il challenger degrada a None.
      - ${LIMEN_MLRUNS_DIR:-${LIMEN_DATA_ROOT:-../../data}/mlruns}:/var/lib/limen/mlruns
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/ready', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    # Il processo dei batch: scheduler APScheduler + ingestor IoT, zero HTTP.
    # Stessa immagine dell'api — è lo stesso codice, cambia solo il comando.
    #
    # `deploy.replicas: 1` è **esplicito e necessario**: `_sweep_lock` in
    # `hourly_monitoring.py` è un `asyncio.Lock` di processo, quindi impedisce
    # due sweep sovrapposti solo dentro un worker. Due repliche farebbero due
    # sweep concorrenti, e il rimedio non è un lock distribuito — che non
    # serve — ma questa riga.
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ${LIMEN_IMAGE_PREFIX:-limen/}api:${LIMEN_IMAGE_TAG:-0.1}
    container_name: limen-worker
    restart: unless-stopped
    command: ["limen", "worker"]
    depends_on:
      # Sull'api e non solo su postgres: le migrazioni le applica l'API al
      # boot, e il worker le **attende** invece di applicarle — due processi
      # che migrano insieme sono una corsa.
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      # Il worker ignora il flag — è la sua ragione di esistere — ma tenerlo
      # esplicito evita che qualcuno legga l'ancora e pensi il contrario.
      SCHEDULER__ENABLED: "true"
      # Il backup notturno dello stato, fuori dal server (#304). Vuoto
      # BACKUP__BUCKET, il passo si salta. La passphrase della CA dei sensori
      # non è qui: la CA sta sull'host, e lì si salva.
      BACKUP__BUCKET: ${BACKUP__BUCKET:-}
      BACKUP__PREFIX: ${BACKUP__PREFIX:-limen}
      BACKUP__REGION: ${BACKUP__REGION:-}
      BACKUP__ENDPOINT_URL: ${BACKUP__ENDPOINT_URL:-}
      BACKUP__ACCESS_KEY_ID: ${BACKUP__ACCESS_KEY_ID:-}
      BACKUP__SECRET_ACCESS_KEY: ${BACKUP__SECRET_ACCESS_KEY:-}
      BACKUP__RETENTION_GIORNI: ${BACKUP__RETENTION_GIORNI:-30}
      BACKUP__TIENI_ALMENO: ${BACKUP__TIENI_ALMENO:-3}
      BACKUP__SOGLIA_CROLLO: ${BACKUP__SOGLIA_CROLLO:-0.5}
      BACKUP__ETA_MASSIMA_ORE: ${BACKUP__ETA_MASSIMA_ORE:-36}
      # Gli artefatti MLflow, al percorso del volume qui sotto.
      BACKUP__CARTELLE: ${BACKUP__CARTELLE:-/var/lib/limen/mlruns}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - limen-objects:/var/lib/limen/objects
      # Cataloghi scaricati (e-ITALICA, archivi FIRMS, mosaici) e report dei
      # backtest. Senza questi due l'immagine non ha dove scrivere: la
      # directory di lavoro e' di root, il processo gira come `limen`, e i
      # comandi morivano su "Permission denied" dopo aver lavorato per minuti.
      - ${LIMEN_DATASETS_DIR:-${LIMEN_DATA_ROOT:-../../data}/datasets}:/var/lib/limen/datasets
      - ${LIMEN_REPORTS_HOST_DIR:-${LIMEN_DATA_ROOT:-../../data}/reports}:/var/lib/limen/reports
      - ${GEOSERVER_SHAPEFILE_DIR:-${LIMEN_DATA_ROOT:-../../data}/geoserver}:/data:ro
      # Il registry sta su Postgres (#78): niente più mlflow.db montato. Gli
      # **artefatti** stanno qui, in /var/lib/limen/mlruns su ogni host (#302).
      - ${LIMEN_MLRUNS_DIR:-${LIMEN_DATA_ROOT:-../../data}/mlruns}:/var/lib/limen/mlruns
    # Nessuna `ports:`: il worker non serve niente.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 8g
    healthcheck:
      # Interroga il database, non il PID: un worker con l'event loop bloccato
      # ha ancora il processo vivo. `--health` esce 0 se l'ultimo battito in
      # `job_runs` è recente.
      test: ["CMD", "limen", "worker", "--health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  mcp:
    # limen-ops MCP server for agent gateways (OpenClaw & co.). Same image
    # as the api (same tag, so a deploy cannot mix versions); HTTP transport on :8766. The host bind defaults to
    # loopback (same-host OpenClaw); set LIMEN_MCP_BIND=0.0.0.0 only when
    # the gateway lives on another machine — and put TLS in front.
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ${LIMEN_IMAGE_PREFIX:-limen/}api:${LIMEN_IMAGE_TAG:-0.1}
    container_name: limen-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["limen", "mcp-serve"]
    environment:
      # The api's environment, not a hand-picked subset: `run_monitor` runs the
      # same workflow as the sweep, and without LLM__* / OPENMETEO__* it looked
      # for the gateway on the container's own loopback and for the public
      # Open-Meteo API, degrading silently on both.
      <<: *api-env
      LIMEN_MCP_TRANSPORT: http
      # Le password dei ruoli ristretti servono ad api e worker, non qui.
      IOT__CITTADINI__DB_PASSWORD: ""
      # Unset ⇒ the run_monitor admin tool is disabled (fail-closed).
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      LOG_JSON: "true"
    # Come api e worker: su Docker Engine per Linux host.docker.internal non
    # esiste da solo, e senza questa riga il gateway LLM dell'ambiente
    # ereditato non risolve — `run_monitor` degraderebbe in silenzio.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LIMEN_MCP_BIND:-127.0.0.1}:8766:8766"
    # Senza questa riga il container eredita dall'immagine la sonda dell'API,
    # che interroga :8080/ready — una porta su cui il server MCP non ascolta:
    # risultava `unhealthy` con il server perfettamente funzionante.
    # Qui si interroga la porta sua. Una risposta HTTP qualunque basta e
    # avanza: /mcp senza sessione risponde 400, ed e' comunque la prova che il
    # server e' su e sta instradando. Solo una connessione rifiutata e' un
    # guasto.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://localhost:8766/mcp', timeout=3)
          except urllib.error.HTTPError:
              pass
          except Exception:
              sys.exit(1)
          "
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mosquitto:
    # Phase 7 — local MQTT broker for the alert pipeline. The API
    # publishes to ``${NOTIFICATIONS__MQTT__BROKER_HOST}`` (default
    # mosquitto:1883); enable the channel by listing "mqtt" in
    # NOTIFICATIONS__ENABLED_CHANNELS. The default mosquitto.conf
    # below allows anonymous connections — fine for local demos,
    # tighten for production.
    image: eclipse-mosquitto:2.0
    container_name: limen-mosquitto
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    # A broker reachable from the whole LAN with anonymous access is the
    # worst case here. Host-side runs still reach it (see
    # NOTIFICATIONS__MQTT__BROKER_PORT in .env.example).
    ports:
      - "${LIMEN_MQTT_BIND:-127.0.0.1}:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t healthz -E -W 2 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  pg_tileserv:
    # Phase 6 — vector tile server pointed at the same Postgres+PostGIS.
    # La SPA lo chiama da nginx su `/tiles/` (VITE_TILESERV_URL); `/api/tiles`
    # dell'API inoltra i byte allo stesso server.
    # Official community image (the GHCR CrunchyData ref is no longer public).
    # Una versione, non `latest`: su un host nuovo `latest` non è quella che
    # gira qui (#303). 20250131 è il `latest` di gennaio 2025.
    image: docker.io/pramsey/pg_tileserv:20250131
    container_name: limen-pg-tileserv
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pg_tileserv pubblica ogni tabella con geometria che il suo ruolo
      # legge: `limen_tiles` (migrazione 078) vede solo i layer della mappa
      # (#269). La password la imposta l'API all'avvio da DB__TILES_PASSWORD;
      # finché manca pg_tileserv non entra e riparte da solo.
      DATABASE_URL: postgres://limen_tiles:${DB__TILES_PASSWORD:-}@postgres:5432/limen?sslmode=disable
      TS_HTTPHOST: "0.0.0.0"
      TS_HTTPPORT: "7800"
    # scripts/demo_walkthrough.sh hits this from the host.
    ports:
      - "${LIMEN_TILESERV_BIND:-127.0.0.1}:7800:7800"
    healthcheck:
      # L'immagine pramsey/pg_tileserv non ha né wget né curl né nc: la sonda
      # HTTP che c'era qui prima falliva sempre con "wget: command not found",
      # e il container risultava `unhealthy` da settimane mentre serviva
      # regolarmente le tile. Un controllo che non può passare è peggio di
      # nessun controllo: nasconde quello vero.
      # Qui si legge la tabella dei socket con le sole primitive della shell.
      # 1E78 è 7800 in esadecimale, 0A è lo stato LISTEN; il processo ascolta
      # su IPv6 (::), quindi la tabella è tcp6.
      test:
        - CMD-SHELL
        - 'while read -r _ l _ s _; do [ "$$s" = 0A ] && case "$$l" in *:1E78) exit 0;; esac; done < /proc/net/tcp6; exit 1'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    # Phase 6 — Vite dev server. In production, build with
    # `npm run build` and either copy `dist/` into the api image
    # (FastAPI can serve it statically — see README) or front it with
    # nginx; this service is a convenience for local iteration.
    image: node:22-bookworm-slim
    container_name: limen-frontend
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Risolti dal BROWSER, non dal container: dietro un reverse proxy
      # 'localhost' e' la macchina di chi guarda, non il server. Vanno
      # sovrascritti con l'origine pubblica (vedi .env).
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_TILESERV_URL: ${VITE_TILESERV_URL:-http://localhost:7800}
      # Host ammessi dal dev server di Vite: dietro proxy l'Host e' il
      # dominio pubblico, e senza elencarlo Vite blocca ogni richiesta.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      # `off` dietro un proxy che non inoltra le WebSocket: senza, il client
      # HMR ricarica la pagina di continuo e nessuna richiesta arriva a
      # completarsi. Vedi la nota in vite.config.ts.
      VITE_HMR: ${VITE_HMR:-}
      # Phase 12 — optional static PMTiles served by the geodata stack.
      # Leave unset to keep the overlays hidden. Production deploys the
      # files behind nginx / Caddy from `$GEODATA_PMTILES_DIR`.
      VITE_PAI_PMTILES_URL: ${VITE_PAI_PMTILES_URL:-}
      VITE_IFFI_PMTILES_URL: ${VITE_IFFI_PMTILES_URL:-}
      # Dove MapLibre prende i caratteri delle etichette. Senza, lo stile non
      # e' valido e la mappa resta bianca: il default vive in `lib/env.ts`,
      # questa riga serve a poterlo sostituire con glifi ospitati in casa.
      VITE_MAP_GLYPHS_URL: ${VITE_MAP_GLYPHS_URL:-}
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ../../frontend:/app
      - frontend-node-modules:/app/node_modules
    # Dev server. Public exposure belongs to a reverse proxy on 443, which is
    # also what VITE_ALLOWED_HOSTS above exists for.
    ports:
      - "${LIMEN_FRONTEND_BIND:-127.0.0.1}:5173:5173"
    profiles: ["frontend"]  # opt-in: `docker compose --profile frontend up`

  # La stessa SPA, ma **costruita**: e' questa che va dietro un dominio
  # pubblico. Il dev server del servizio qui sopra serve moduli non compilati e
  # inietta il client HMR, che dietro un proxy senza WebSocket non si connette
  # e **ricarica la pagina** di continuo: misurato sui log di nginx, decine di
  # richieste chiuse dal client (499) su tile e API, con la mappa che non
  # arrivava mai a disegnare.
  #
  # Stessa porta del dev server, cosi' il reverse proxy non cambia:
  #   docker compose --profile geoserver --profile frontend-static up -d
  frontend-static:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Vite riscrive gli URL degli asset **durante la build**: questi
        # valori non si possono cambiare dopo, vanno passati qui.
        BASE_PATH: ${LIMEN_BASE_PATH:-/}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_TILESERV_URL: ${VITE_TILESERV_URL:-http://localhost:7800}
        VITE_PAI_PMTILES_URL: ${VITE_PAI_PMTILES_URL:-}
        VITE_IFFI_PMTILES_URL: ${VITE_IFFI_PMTILES_URL:-}
        VITE_GEOSERVER_WMS_URL: ${VITE_GEOSERVER_WMS_URL:-}
        VITE_MAP_GLYPHS_URL: ${VITE_MAP_GLYPHS_URL:-}
        VITE_DEFAULT_LON: ${VITE_DEFAULT_LON:-}
        VITE_DEFAULT_LAT: ${VITE_DEFAULT_LAT:-}
        VITE_DEFAULT_ZOOM: ${VITE_DEFAULT_ZOOM:-}
    image: ${LIMEN_IMAGE_PREFIX:-limen/}web:${LIMEN_IMAGE_TAG:-0.1}
    container_name: limen-frontend-static
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LIMEN_FRONTEND_BIND:-127.0.0.1}:5173:80"
    profiles: ["frontend-static"]

  # ── Sidecar knowledge-graph: NON definito qui, di proposito ────────────
  #
  # Questo file conteneva un servizio `knowledge-graph` sotto il profilo `kg`
  # che non e' mai stato avviabile, per tre ragioni indipendenti:
  #
  #   1. puntava a ghcr.io/agent-engineering-studio/knowledge-graph:latest,
  #      un'immagine che NON esiste. Quel repo pubblica QUATTRO immagini
  #      (kg-api, kg-ui, kg-mcp, kg-agents): il nome monolitico era
  #      un'invenzione dello sketch;
  #   2. dichiarava NEO4J_URI=bolt://neo4j:7687 e REDIS_URL=redis://redis:6379
  #      verso servizi `neo4j` e `redis` che in questo compose non esistono;
  #   3. usava host.docker.internal senza `extra_hosts: host-gateway`, quindi
  #      su Linux il nome non risolveva.
  #
  # Lo stack KG vive nel SUO repo, che ha gia' un compose completo
  # (docker-compose.ghcr.yml: neo4j + redis + api + ui + mcp + agents).
  # Duplicarne un sottoinsieme qui significherebbe tenere allineate a mano due
  # configurazioni — variabili del motore, auth Neo4j, REDIS_VECTOR_DIM — con
  # l'unico effetto di farle divergere. Coerente con l'invariante "KG is
  # advisory only": l'immagine e' di proprieta' di quel repo.
  #
  # Per abilitare il grounding:
  #   1. avvia lo stack dal repo knowledge-graph:
  #        docker compose -f docker-compose.ghcr.yml up -d
  #   2. qui imposta KG__ENABLED=true e KG__BASE_URL verso il suo kg-api
  #      (host.docker.internal:<porta> se gira sullo stesso host, mai
  #      127.0.0.1 che dentro il container e' il container stesso). Non la
  #      8000 del default qui sopra: sull'host e' gia' della geoserver-webui
  #      (docker-compose.geoserver.yml), che a /search risponde con HTML.
  #
  # Il motore del sidecar si configura NEL SUO repo, non qui: il suo default e'
  # gia' `llamacpp` (client OpenAI su /v1), quindi va puntato allo stesso
  # gateway :8091 che usa l'API. Vedi docs/inference.md.
  #
  # ATTENZIONE (verificato 2026-09-03): kg-api:latest su GHCR e' ancora
  # costruita da eab6c0b (11 giugno) perche' la CI di quel repo e' rossa e
  # `docker-publish` e' gated su di essa — quindi l'immagine pubblicata NON
  # contiene il provider llama.cpp/OpenAI, nonostante il codice sia su main.
  # Vedi knowledge-graph#7 (blocco CI) e #6 (provider openai).

  proxy:
    # Il reverse proxy in compose (#306), al posto dell'nginx dell'host: Caddy
    # prende e rinnova da sé i certificati di LIMEN_DOMINIO (Let's Encrypt,
    # porte 80 e 443 raggiungibili da fuori). Le rotte sono quelle di
    # infra/nginx/limen.agentengineering.it, e la configurazione sta qui sotto
    # (`configs`), non in un file del repo: su un host che ha solo i compose e
    # il .env (#303) il proxy funziona lo stesso.
    #
    # È l'unico servizio che pubblica su tutte le interfacce per default:
    # esiste per essere l'ingresso pubblico. LIMEN_PROXY_BIND lo restringe.
    image: caddy:2.8.4
    container_name: limen-proxy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "${LIMEN_PROXY_BIND:-0.0.0.0}:80:80"
      - "${LIMEN_PROXY_BIND:-0.0.0.0}:443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - limen-caddy-data:/data
      - limen-caddy-config:/config

configs:
  caddyfile:
    # `$$` è un `$` per Caddy: compose interpola il resto. Un dominio non
    # impostato dà `localhost`, con un certificato interno di Caddy.
    content: |
      ${LIMEN_DOMINIO:-localhost} {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options nosniff
          X-Frame-Options SAMEORIGIN
          Referrer-Policy strict-origin-when-cross-origin
        }
        request_body {
          max_size 10MB
        }

        handle /api/* {
          reverse_proxy api:8080 {
            # Contributi e registrazione sensori fanno il limite per IP su
            # X-Real-IP: Caddy di suo lo inoltra com'è, e un client che lo
            # cambia a ogni richiesta aggirerebbe il limite (Codex, #330).
            # Come nginx: lo scrive il proxy, con l'indirizzo vero.
            header_up X-Real-IP {remote_host}
            flush_interval -1
            transport http {
              read_timeout 900s
            }
          }
        }
        @api_docs path /health /openapi.json /docs /redoc
        handle @api_docs {
          reverse_proxy api:8080 {
            header_up X-Real-IP {remote_host}
          }
        }

        # pg_tileserv vuole i percorsi senza /tiles.
        handle_path /tiles/* {
          reverse_proxy pg_tileserv:7800
        }

        # Solo il WMS, in lettura: il resto di /geoserver/ è il pannello di
        # amministrazione e resta dentro la rete di Docker.
        @wms {
          path /geoserver/ispra/wms
          method GET
        }
        handle @wms {
          reverse_proxy geoserver:8080
        }

        # Ingresso HTTP dei sensori (#265) e webhook TTN (#266): risponde solo
        # con docker-compose.sensori-worker.yml. Gli stessi tetti di corpo di
        # nginx; il limite di richieste per IP no — Caddy di serie non ce l'ha.
        handle /sensori/v2/ttn {
          request_body {
            max_size 64KB
          }
          reverse_proxy worker:8087 {
            header_up X-Real-IP {remote_host}
          }
        }
        handle /sensori/v2/* {
          request_body {
            max_size 4KB
          }
          reverse_proxy worker:8087 {
            header_up X-Real-IP {remote_host}
          }
        }

        handle {
          reverse_proxy frontend-static:80
        }
      }

volumes:
  limen-pgdata:
    name: limen-pgdata
  limen-objects:
    name: limen-objects
  frontend-node-modules:
    name: limen-frontend-node-modules
  limen-caddy-data:
    name: limen-caddy-data
  limen-caddy-config:
    name: limen-caddy-config
