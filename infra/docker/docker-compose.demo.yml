# Full demo stack: Postgres + PostGIS + Limen API.
#
# Brings up the database and the FastAPI app in a single command:
#
#     docker compose -f infra/docker/docker-compose.demo.yml up -d --build
#
# The API points at the local Postgres by default. To target Neon
# instead, override DB__CONNECTION_STRING (and keep
# SCHEDULER__CACHE_CLEANUP=apscheduler) — no other change needed:
#
#     DB__CONNECTION_STRING="postgresql://...neon.tech/...?sslmode=require" \
#     docker compose -f infra/docker/docker-compose.demo.yml up -d --build api

name: limen-demo

services:
  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile.db
      args:
        # Upstream postgis/postgis has no arm64 manifest; the Makefile passes
        # the multi-arch imresamu image on Apple Silicon. Default keeps amd64.
        POSTGIS_BASE: ${POSTGIS_BASE:-postgis/postgis:16-3.5}
    image: limen/postgres:16-3.5
    container_name: limen-postgres
    restart: unless-stopped
    # Parallel workers on national-scale aggregations (312k cells) blow
    # through Docker's 64 MB /dev/shm default → DiskFullError.
    shm_size: 1gb
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen
      POSTGRES_DB: limen
      PGDATA: /var/lib/postgresql/data/pgdata
    # Docker publishes ports by writing its OWN iptables chains, which are
    # consulted BEFORE ufw's — so the host's `default deny incoming` does not
    # protect a published port. Bind defaults to loopback; override the
    # variable (to 0.0.0.0 or a specific interface) only with something in
    # front of it.
    # Host-side `uv run limen migrate/seed/...` connects here (see
    # DB__CONNECTION_STRING in .env.example), so the port stays published —
    # just not to the LAN.
    ports:
      - "${LIMEN_PG_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ${LIMEN_PGDATA_DIR:-limen-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limen -d limen"]
      interval: 5s
      timeout: 5s
      retries: 20
      # After an unclean stop Postgres fsyncs every file in the data
      # directory before recovery starts, and it will not accept
      # connections until that finishes. On fast storage that is seconds;
      # on a degraded array it can be tens of minutes (measured on the
      # dedicated server: ~2 s per file over 1267 files). Failures inside
      # start_period don't count against `retries`, so raise
      # LIMEN_PG_START_PERIOD there rather than watch `depends_on` give up
      # on a database that was merely still starting.
      start_period: ${LIMEN_PG_START_PERIOD:-10s}

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: limen/api:0.1
    container_name: limen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override these via the shell to point at Neon or a managed PG.
      DB__CONNECTION_STRING: postgresql://limen:limen@postgres:5432/limen
      OBJECT_STORE__BACKEND: filesystem
      OBJECT_STORE__ROOT: /var/lib/limen/objects
      SCHEDULER__CACHE_CLEANUP: apscheduler
      API__HOST: 0.0.0.0
      API__PG_TILESERV_URL: http://pg_tileserv:7800
      # Notifications — listing a channel here enables it; channels
      # whose creds are missing degrade to a no-op rather than erroring.
      # NOTIFICATIONS__ENABLED_CHANNELS: '["mqtt"]'
      NOTIFICATIONS__MQTT__BROKER_HOST: mosquitto
      NOTIFICATIONS__MQTT__BROKER_PORT: "1883"
      NOTIFICATIONS__MQTT__TOPIC: limen/alerts
      ALERT__MIN_LEVEL: High
      ALERT__DEDUP_WINDOW_MINUTES: "180"
      API__PORT: "8080"
      LOG_JSON: "true"
      # Optional LLM credentials. The provider is pinned below
      # (LLM__PROVIDER), so setting a key here is not enough on its own —
      # switch LLM__PROVIDER too, and only with the `agents` group installed.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # OPENAI_API_KEY:    ${OPENAI_API_KEY}
      # V2.x — KG advisory grounding. OFF by default. The sidecar is NOT a
      # service of this compose (see the note where it used to be, further
      # down): it runs from its own repo. Default points at its kg-api on the
      # host — host.docker.internal, never 127.0.0.1, which inside a container
      # is the container itself. API_-prefixed override so a host-side value in
      # .env never leaks in here.
      KG__ENABLED: ${KG__ENABLED:-false}
      KG__BASE_URL: ${API_KG_BASE_URL:-http://host.docker.internal:8000}
      KG__THREAD_ID: landslide-kb
      KG__TIMEOUT_SECONDS: "3.0"
      KG__CACHE_TTL_SECONDS: "3600"
      # GeoServer PostGIS as the authoritative ISPRA static-data source.
      # Resolves by service name on the merged `make up` network. Uses an
      # API_-prefixed override so the host-side GEOSERVER_SOURCE__DB_DSN in
      # .env (localhost:55433, for host `uv run`) never leaks in here.
      GEOSERVER_SOURCE__DB_DSN: ${API_GEOSERVER_SOURCE_DSN:-postgresql://gis:gis@geoserver-postgis:5432/gis}
      # DTM path INSIDE the container (the shared /data folder is mounted
      # below). Distinct from the host-side LIMEN_DEM_RASTER so a host path
      # never leaks into the container. Empty ⇒ in-container DEM step is a
      # no-op; the heavy DTM slope bootstrap normally runs on the host.
      # Set API_DEM_RASTER=/data/HRDTM5m.tif to enable it in-container.
      LIMEN_DEM_RASTER: ${API_DEM_RASTER:-}
      # LLM backend — self-hosted gateway | host Ollama | Ollama Cloud | Claude.
      #   gateway:      LLM__LLAMACPP_BASE_URL=http://host.docker.internal:8091
      #   host Ollama:  LLM__PROVIDER=ollama + LLM__OLLAMA_BASE_URL=...:11434
      #   Ollama Cloud: LLM__PROVIDER=ollama + https://ollama.com + API key
      #   Claude:       ANTHROPIC_API_KEY (or LLM__PROVIDER=anthropic)
      # The provider is PINNED here rather than autodetected: the image ships
      # without the `agents` group (no anthropic/openai SDK), so a leaked
      # ANTHROPIC_API_KEY must not be auto-selected. Override to
      # anthropic/openai only with the SDK installed.
      #
      # Default is `llamacpp` — the LiteLLM gateway. It used to be `ollama`,
      # from when a host Ollama on :11434 was the only local engine; that pin
      # now contradicts both the code's documented fallback order and the
      # actual host, where nothing listens on 11434. Both defaults fail the
      # same way when their engine is absent (connection refused → the
      # non-authoritative LLM path degrades to the deterministic text, which
      # is the invariant), so the tie-breaker is which one is right when the
      # engine IS present.
      LLM__PROVIDER: ${LLM__PROVIDER:-llamacpp}
      # Host-Ollama URL differs host vs container, so use an API_-prefixed
      # override (defaults to host.docker.internal). Ollama Cloud / Anthropic
      # need no such split — the key/base are identical everywhere.
      LLM__OLLAMA_BASE_URL: ${API_LLM_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM__OLLAMA_MODEL: ${LLM__OLLAMA_MODEL:-qwen3.6:latest}
      # Self-hosted inference server on the host (aes-inference-lab). The
      # base URL is the LiteLLM gateway, not llama-swap directly: routing by
      # model name, budget cap and the local->cloud fallback all live there,
      # and a direct port bypasses them. No /v1 suffix — the client appends
      # /v1/chat/completions itself. Same host-vs-container split as Ollama,
      # hence the API_-prefixed override.
      LLM__LLAMACPP_BASE_URL: ${API_LLM_LLAMACPP_BASE_URL:-http://host.docker.internal:8091}
      # Gateway model name, not a file: 'chat' is Qwen3-8B, the one picked
      # for Italian prose. 'fast' is the 4B, 'extract' the JSON profile.
      LLM__LLAMACPP_MODEL: ${LLM__LLAMACPP_MODEL:-chat}
      LLM__LLAMACPP_API_KEY: ${LLM__LLAMACPP_API_KEY:-}
      # Ceiling for roles with no per-role override. Sized for the GPU-resident
      # gateway models on NVMe (a swap is seconds). Was 900 s, from when the
      # GGUFs lived on spinning disk; that high a ceiling now only delays the
      # moment you notice the engine is broken.
      LLM__LLAMACPP_TIMEOUT_SECONDS: ${LLM__LLAMACPP_TIMEOUT_SECONDS:-120}
      # Per-role ceiling, JSON keyed by agent-role label. Only needed for a
      # role deliberately pointed at a slow model — which today no role may be
      # (see LLM__MODELS__* below).
      LLM__LLAMACPP_ROLE_TIMEOUT_SECONDS: ${LLM__LLAMACPP_ROLE_TIMEOUT_SECONDS:-{}}
      # Per-role model routing. These are GATEWAY model names (keys in its
      # model_list), not file names — which is what makes a per-role map
      # possible at all. Only the roles set here reach the local engine; the
      # rest fall back to LLM__LLAMACPP_MODEL, because the code defaults are
      # Claude ids the gateway would reject.
      #
      # Only RiskAnalyst and Briefing are wired to an executor today
      # (agents/workflows/main_workflow.py); the other three are declared
      # config with no call site yet.
      #
      # RiskAnalyst emits strict JSON validated by Pydantic, so it gets
      # `extract` (the JSON-grammar profile) rather than the general-purpose
      # 4B. Briefing writes 150-250 words of Italian prose → `chat` (8B).
      # NEVER put `quality-local` or `glm52` here: every one of these roles is
      # invoked synchronously and the process refuses to start if you do.
      LLM__MODELS__RISK_ANALYST: ${LLM__MODELS__RISK_ANALYST:-extract}
      LLM__MODELS__BRIEFING: ${LLM__MODELS__BRIEFING:-chat}
      LLM__MODELS__ORCHESTRATOR: ${LLM__MODELS__ORCHESTRATOR:-fast}
      LLM__MODELS__SCORER: ${LLM__MODELS__SCORER:-fast}
      LLM__MODELS__SUMMARIZER: ${LLM__MODELS__SUMMARIZER:-fast}
      # Champion/challenger: shadow runs the ML model in parallel (writes
      # model_runs only; alerts stay with the deterministic champion).
      SCORING__MODE: ${SCORING__MODE:-champion_only}
      # Event-driven predictive sweep (forecast rain → predictive alerts).
      FORECAST__ENABLED: ${FORECAST__ENABLED:-true}
      FORECAST__HORIZON_HOURS: ${FORECAST__HORIZON_HOURS:-48}
      FORECAST__INTERVAL_HOURS: ${FORECAST__INTERVAL_HOURS:-6}
      FORECAST__MIN_LEVEL: ${FORECAST__MIN_LEVEL:-High}
      # DPC radar nowcast trigger (SRI 1 km / 5 min, CC-BY-SA).
      NOWCAST__ENABLED: ${NOWCAST__ENABLED:-true}
      NOWCAST__INTERVAL_MINUTES: ${NOWCAST__INTERVAL_MINUTES:-15}
      NOWCAST__MIN_INTENSITY_MMH: ${NOWCAST__MIN_INTENSITY_MMH:-30}
      REPORT__ENABLED: ${REPORT__ENABLED:-true}
      REPORT__HOUR_UTC: ${REPORT__HOUR_UTC:-6}
      SCORING__MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
      LLM__OLLAMA_API_KEY: ${LLM__OLLAMA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # So host.docker.internal (the inference gateway on the host) resolves on
      # Linux too. 127.0.0.1 inside a container is the container itself.
      - "host.docker.internal:host-gateway"
    # Public surface, but published to loopback: put a reverse proxy on 443
    # in front rather than exposing 8080 directly. See the postgres note above
    # for why ufw is not the control here.
    ports:
      - "${LIMEN_API_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - limen-objects:/var/lib/limen/objects
      # DTM / shared vector data (read-only). Same folder GeoServer serves.
      - ${GEOSERVER_SHAPEFILE_DIR:-../../../mcp-geoserver/data}:/data:ro
      # MLflow registry for the shadow challenger. mlruns mounts at the SAME
      # absolute path as on the host: the registry stores absolute artifact
      # URIs at log time. rw because model load writes registered_model_meta
      # into the artifact dir. Missing files ⇒ challenger degrades to None.
      - ../../mlflow.db:/app/mlflow.db:ro
      - ../../mlruns:/Users/gzileni/Git/limen/mlruns
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/ready', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp:
    # limen-ops MCP server for agent gateways (OpenClaw & co.). Same image
    # as the api; HTTP transport on :8766. The host bind defaults to
    # loopback (same-host OpenClaw); set LIMEN_MCP_BIND=0.0.0.0 only when
    # the gateway lives on another machine — and put TLS in front.
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: limen/mcp:0.1
    container_name: limen-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["limen", "mcp-serve"]
    environment:
      DB__CONNECTION_STRING: postgresql://limen:limen@postgres:5432/limen
      LIMEN_MCP_TRANSPORT: http
      # Unset ⇒ the run_monitor admin tool is disabled (fail-closed).
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      LOG_JSON: "true"
    ports:
      - "${LIMEN_MCP_BIND:-127.0.0.1}:8766:8766"

  mosquitto:
    # Phase 7 — local MQTT broker for the alert pipeline. The API
    # publishes to ``${NOTIFICATIONS__MQTT__BROKER_HOST}`` (default
    # mosquitto:1883); enable the channel by listing "mqtt" in
    # NOTIFICATIONS__ENABLED_CHANNELS. The default mosquitto.conf
    # below allows anonymous connections — fine for local demos,
    # tighten for production.
    image: eclipse-mosquitto:2.0
    container_name: limen-mosquitto
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    # A broker reachable from the whole LAN with anonymous access is the
    # worst case here. Host-side runs still reach it (see
    # NOTIFICATIONS__MQTT__BROKER_PORT in .env.example).
    ports:
      - "${LIMEN_MQTT_BIND:-127.0.0.1}:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t healthz -E -W 2 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  pg_tileserv:
    # Phase 6 — vector tile server pointed at the same Postgres+PostGIS.
    # The frontend talks to `${VITE_API_URL}/api/tiles/...`, the FastAPI
    # /api/tiles endpoint 307-redirects here. To target Neon or any
    # other PG, point CrunchyData/pg_tileserv at it via DATABASE_URL.
    # Official community image (the GHCR CrunchyData ref is no longer public).
    image: docker.io/pramsey/pg_tileserv:latest
    container_name: limen-pg-tileserv
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://limen:limen@postgres:5432/limen?sslmode=disable
      # Read-only; pg_tileserv auto-discovers tables/functions allowed
      # by the role's permissions. Restrict in production by creating
      # a dedicated `tile_reader` role.
      TS_HTTPHOST: "0.0.0.0"
      TS_HTTPPORT: "7800"
    # scripts/demo_walkthrough.sh hits this from the host.
    ports:
      - "${LIMEN_TILESERV_BIND:-127.0.0.1}:7800:7800"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7800/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    # Phase 6 — Vite dev server. In production, build with
    # `npm run build` and either copy `dist/` into the api image
    # (FastAPI can serve it statically — see README) or front it with
    # nginx; this service is a convenience for local iteration.
    image: node:22-bookworm-slim
    container_name: limen-frontend
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Risolti dal BROWSER, non dal container: dietro un reverse proxy
      # 'localhost' e' la macchina di chi guarda, non il server. Vanno
      # sovrascritti con l'origine pubblica (vedi .env).
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_TILESERV_URL: ${VITE_TILESERV_URL:-http://localhost:7800}
      # Host ammessi dal dev server di Vite: dietro proxy l'Host e' il
      # dominio pubblico, e senza elencarlo Vite blocca ogni richiesta.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      # Phase 12 — optional static PMTiles served by the geodata stack.
      # Leave unset to keep the overlays hidden. Production deploys the
      # files behind nginx / Caddy from `$GEODATA_PMTILES_DIR`.
      VITE_PAI_PMTILES_URL: ${VITE_PAI_PMTILES_URL:-}
      VITE_IFFI_PMTILES_URL: ${VITE_IFFI_PMTILES_URL:-}
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ../../frontend:/app
      - frontend-node-modules:/app/node_modules
    # Dev server. Public exposure belongs to a reverse proxy on 443, which is
    # also what VITE_ALLOWED_HOSTS above exists for.
    ports:
      - "${LIMEN_FRONTEND_BIND:-127.0.0.1}:5173:5173"
    profiles: ["frontend"]  # opt-in: `docker compose --profile frontend up`

  # ── Sidecar knowledge-graph: NON definito qui, di proposito ────────────
  #
  # Questo file conteneva un servizio `knowledge-graph` sotto il profilo `kg`
  # che non e' mai stato avviabile, per tre ragioni indipendenti:
  #
  #   1. puntava a ghcr.io/agent-engineering-studio/knowledge-graph:latest,
  #      un'immagine che NON esiste. Quel repo pubblica QUATTRO immagini
  #      (kg-api, kg-ui, kg-mcp, kg-agents): il nome monolitico era
  #      un'invenzione dello sketch;
  #   2. dichiarava NEO4J_URI=bolt://neo4j:7687 e REDIS_URL=redis://redis:6379
  #      verso servizi `neo4j` e `redis` che in questo compose non esistono;
  #   3. usava host.docker.internal senza `extra_hosts: host-gateway`, quindi
  #      su Linux il nome non risolveva.
  #
  # Lo stack KG vive nel SUO repo, che ha gia' un compose completo
  # (docker-compose.ghcr.yml: neo4j + redis + api + ui + mcp + agents).
  # Duplicarne un sottoinsieme qui significherebbe tenere allineate a mano due
  # configurazioni — variabili del motore, auth Neo4j, REDIS_VECTOR_DIM — con
  # l'unico effetto di farle divergere. Coerente con l'invariante "KG is
  # advisory only": l'immagine e' di proprieta' di quel repo.
  #
  # Per abilitare il grounding:
  #   1. avvia lo stack dal repo knowledge-graph:
  #        docker compose -f docker-compose.ghcr.yml up -d
  #   2. qui imposta KG__ENABLED=true e KG__BASE_URL verso il suo kg-api
  #      (host.docker.internal:8000 se gira sullo stesso host, mai 127.0.0.1
  #      che dentro il container e' il container stesso).
  #
  # Il motore del sidecar si configura NEL SUO repo, non qui: il suo default e'
  # gia' `llamacpp` (client OpenAI su /v1), quindi va puntato allo stesso
  # gateway :8091 che usa l'API. Vedi docs/inference.md.
  #
  # ATTENZIONE (verificato 2026-09-03): kg-api:latest su GHCR e' ancora
  # costruita da eab6c0b (11 giugno) perche' la CI di quel repo e' rossa e
  # `docker-publish` e' gated su di essa — quindi l'immagine pubblicata NON
  # contiene il provider llama.cpp/OpenAI, nonostante il codice sia su main.
  # Vedi knowledge-graph#7 (blocco CI) e #6 (provider openai).

volumes:
  limen-pgdata:
    name: limen-pgdata
  limen-objects:
    name: limen-objects
  frontend-node-modules:
    name: limen-frontend-node-modules
