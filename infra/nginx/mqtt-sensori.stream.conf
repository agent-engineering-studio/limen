# Broker MQTT dei sensori (#260): la porta pubblica 8883 e' di nginx, il
# container resta sul loopback (127.0.0.1:18883).
#
# Passthrough TCP, SENZA terminare il TLS: e' il broker a verificare il
# certificato del dispositivo e a ricavarne l'identita' (CN). Terminandolo
# qui, Mosquitto vedrebbe una connessione senza certificato.
#
# Installazione (root):
#   apt install libnginx-mod-stream            # se `nginx -V` mostra --with-stream=dynamic
#   install -m 644 infra/nginx/mqtt-sensori.stream.conf /etc/nginx/mqtt-sensori.stream.conf
#   echo 'include /etc/nginx/mqtt-sensori.stream.conf;' >> /etc/nginx/nginx.conf   # FUORI dal blocco http
#   nginx -t && systemctl reload nginx
#   ufw allow 8883/tcp
# e, con l'IP dinamico della fibra, l'inoltro della 8883 sul router.

stream {
    # Un IP non apre piu' di 20 connessioni: basta a un gateway LoRaWAN o a
    # una scuola dietro un solo indirizzo, non a chi prova a esaurire le
    # 5000 connessioni del broker.
    limit_conn_zone $binary_remote_addr zone=mqtt_sensori_ip:10m;

    upstream limen_mqtt_sensori {
        server 127.0.0.1:18883;
    }

    server {
        listen 8883;
        listen [::]:8883;
        proxy_pass limen_mqtt_sensori;
        limit_conn mqtt_sensori_ip 20;
        proxy_connect_timeout 5s;
        # Sopra il `max_keepalive` del broker (600 s): nginx non deve chiudere
        # una connessione che il dispositivo tiene viva con i suoi PINGREQ.
        proxy_timeout 15m;
    }
}
