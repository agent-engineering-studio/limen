# Flood hazard configuration (issue #63).
#
#     score = suscettibilità × max(pluviale, fluviale)
#
# Un massimo, non una somma: i due sono modi diversi perché la stessa cella
# finisca sott'acqua, e una cella non è più allagata perché potrebbero
# accadere entrambi — conta il peggiore, che è quello su cui un operatore
# deve pianificare.
#
# La suscettibilità viene dal mosaico idraulico ISPRA, già ingerito in
# `flood_hazard_subdiv` e normalizzato per cella in `flood_hazard_norm`: è il
# layer che il progetto ha in casa da più tempo, e qui smette di essere solo
# il componente H del motore frane per diventare la base di un pericolo suo.

model_version: "flood-v1.1.0"

susceptibility:
  # Una cella fuori dalle zone mappate. Non zero: il mosaico copre i bacini
  # ufficialmente studiati, e "non studiato" non vuol dire "non allagabile".
  # Abbastanza basso da non far arrivare in classe alta una cella non mappata
  # con la sola pioggia, abbastanza alto da non farla sparire dalla mappa.
  unmapped: 0.15
  # Sotto questa soglia la cella è terra asciutta e il motore va a zero: un
  # crinale non si allaga, qualunque pioggia faccia.
  floor: 0.05

pluvial:
  # Soglia intensità-durata per l'allagamento. Stessa meccanica della soglia
  # di Caine e numeri suoi: la pioggia che satura un versante non è quella
  # che riempie un alveo.
  #
  # **La finestra è 72 h e i numeri sono per 72 h.** Non è un dettaglio: il
  # segnale disponibile è l'accumulo previsto a 72 h (`DynamicInputs.
  # flood_forecast_rain_72h_mm`, condiviso con il componente H delle frane), e
  # confrontarlo con soglie calibrate su 24 h farebbe scattare il trigger su un
  # autunno normale. Il workflow legge `window_hours` e va a prendere
  # esattamente quella finestra, così le due cose non possono divergere.
  #
  # **Ritarati sul truth set** (#64), non scelti a naso. I primi numeri
  # (80-250 mm) erano fuori dall'ordine di grandezza del fenomeno: una cella
  # con suscettibilità 0,80 — la mediana di quelle realmente allagate —
  # doveva vedere ~176 mm/72 h per entrare in classe alta, e solo il 4,8%
  # delle celle allagate ne ha visti almeno 150. Il 95% dei mancati era
  # garantito dalla taratura, prima di qualunque considerazione sul modello.
  #
  # Derivazione, su 1.999 celle allagate e 24.993 celle osservate e asciutte
  # (Emilia-Romagna e Toscana, perimetri Copernicus EMS 2023-2025, pioggia
  # dall'archivio Open-Meteo):
  #
  #   pioggia 72 h (mm)   p10    p25    p50    p75    p90
  #   allagate           45,7   63,7   86,2  104,8  126,6
  #   asciutte           35,0   48,4   72,9  107,5  158,1
  #
  # `threshold_mm` = 40, appena sotto il p10 delle allagate, così gli eventi
  # veri stanno sulla rampa e non sotto il suo piede. `saturation_mm` = 120
  # risolve (86,2 − 40) / (S − 40) = 0,45 / 0,80, cioè mette la cella allagata
  # mediana esattamente sul confine della classe alta alla suscettibilità
  # mediana delle allagate. Nessun parametro libero: due percentili e un
  # cutoff di classe.
  #
  # **Quello che questa taratura non può fare, e va detto.** Le due
  # distribuzioni si sovrappongono quasi del tutto, e sopra i 120 mm sono le
  # celle *asciutte* a superare la soglia più spesso (19,4% contro 11,1%).
  # Dentro l'impronta di un'alluvione ha piovuto su tutti allo stesso modo:
  # quel che decide quali celle finiscono sott'acqua è l'incanalamento, non
  # l'accumulo locale. Nessun valore di queste due soglie separa le une dalle
  # altre, e cercarlo sarebbe adattarsi al rumore. Il FAR resta alto per
  # questo motivo, non per la scelta dei numeri: servirebbe un segnale di
  # routing (quota sul reticolo idrografico più vicino, o le classi di tempo
  # di ritorno del mosaico usate come tali), che oggi non c'è.
  #
  # Esito misurato (Emilia-Romagna, replica `issued`, finestra dal 2024-09-04,
  # stesso filtro sui nodi senza corso d'acqua):
  #
  #                   hit rate   tasso base   rapporto   FAR   preavviso
  #   80-250 mm            4%         0,3%      12,4x    94%       22 h
  #   40-120 mm           77%         7,3%      10,6x    79%       50 h
  #
  # Il gate sull'hit rate passa, quello sul FAR resta fallito. Era il
  # risultato atteso: la taratura ha rimesso le soglie nell'ordine di
  # grandezza del fenomeno, la discriminazione non può darla.
  threshold_mm:  40.0
  saturation_mm: 120.0
  window_hours:  72

  # Suolo già saturo ⇒ la stessa pioggia scorre invece di infiltrarsi.
  wet_soil: 0.35
  # Suolo completamente asciutto: la prima pioggia se la beve il terreno.
  dry_soil_factor: 0.45

fluvial:
  # Portata prevista rapportata alla normale recente (GloFAS via Open-Meteo:
  # picco dei prossimi 7 giorni / media dei 31 precedenti).
  #
  # Le soglie di tempo di ritorno di EFAS (2/5/20 anni) sarebbero il segnale
  # migliore, ma richiedono un account CDS e una dipendenza NetCDF: un client
  # che non si può eseguire non è un client. Il rapporto è ciò che è
  # disponibile senza credenziali, ed è già ingerito.
  normal_ratio:     1.5
  saturation_ratio: 4.0

imperviousness:
  # Suolo impermeabilizzato: amplifica **solo** il ramo pluviale. Il cemento
  # non fa crescere un fiume, fa scorrere la stessa pioggia invece di
  # lasciarla infiltrare — è il meccanismo del flash flood urbano.
  max_multiplier: 1.6

# Cutoff di classe. Più stretti in alto rispetto alle frane: un allagamento è
# un evento a soglia — o l'acqua esce dall'alveo o non esce — quindi la fascia
# alta deve scattare prima di quanto farebbe una scala lineare.
classes:
  none:      [0.00, 0.10]
  low:       [0.10, 0.25]
  moderate:  [0.25, 0.45]
  high:      [0.45, 0.70]
  very_high: [0.70, 1.00]

pc_alert:
  none:      verde
  low:       verde
  moderate:  gialla
  high:      arancione
  very_high: rossa

# Gate §2.5 per il backtest alluvione (#64), verificati da `limen
# backtest-flood` contro i perimetri allagati osservati di Copernicus EMS.
#
# Gli stessi numeri delle frane su hit rate e FAR, perché la domanda è la
# stessa e i due report devono poter stare accanto. Il **preavviso minimo** no:
# 12 h invece di 18, perché un allagamento è un evento a soglia con
# un'insorgenza rapida — la pioggia che riempie un alveo arriva in ore, non
# nei giorni di pioggia antecedente che precedono una frana, e pretendere 18 h
# scarterebbe come tardivi avvisi che un centro operativo usa benissimo.
#
# Una precisazione che cambia la lettura del FAR: qui il denominatore sono i
# **giorni-cella osservati**, non tutte le allerte. Dentro una maschera di
# osservazione EMS l'assenza di poligono allagato è un "non allagato"
# osservato; fuori non è informazione, e quell'allerta è `non verificabile`,
# non falsa. Misurato sul Piemonte prima di introdurre la distinzione: FAR
# 100% con 10.021 avvisi contro 12 celle di verità, perché EMSR800 aveva
# mappato 0,3 km². Un FAR calcolato su tutte le allerte non misura il modello,
# misura quanto ha guardato il satellite.
calibration:
  s_vs_ispra_correlation_min: null
  backtest:
    hit_rate_min:            0.70
    far_max:                 0.30
    lead_time_hours_min:     12.0

# Priorità degli alert (non scoring). Un allagamento colpisce ciò che sta in
# basso e vicino: le stesse bande degli altri pericoli, senza il termine WUI
# che ha senso solo per il fuoco.
exposure:
  urban_here:    1.0
  urban_near:    0.5
  road_strong_m: 250.0
  road_medium_m: 1000.0
  rail_strong_m: 250.0
  rail_medium_m: 1000.0
