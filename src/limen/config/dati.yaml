# Catalogo dei dati statici di Limen (#401, epic #409).
#
# Una voce per ogni dato che serve a un pericolo: cosa è, a cosa serve, cosa
# succede se manca, da dove viene, sotto quale licenza, quanto pesa e come si
# procura. `limen data-status` lo legge invece di tenerne una copia propria;
# la pagina di installazione (#404) e i download del worker (#402) leggeranno
# lo stesso file. Aggiungere un dato = una voce qui.
#
# livello:
#   essenziale  senza, il pericolo non distingue un posto dall'altro
#   consigliato migliora la precisione, la mappa ha senso anche senza
#   avanzato    serve al modello ML in ombra o ai backtest, non alla mappa
#
# misura: come si conta la copertura — `colonna` di cell_static_factors
# (celle con un valore) oppure `tabella` (righe).
#
# peso_gb: quanto si scarica la prima volta, misurato su un'installazione
# nazionale (2026-11-03). I file che una sorgente condivide (lo stesso
# download IdroGEO dà IFFI e i due mosaici) stanno sulla voce che li porta.

voci:
  - id: iffi
    nome: densità frane storiche (IFFI)
    a_cosa_serve: >-
      Dove la terra è già franata, tende a franare di nuovo. Senza l'inventario
      delle 721.365 frane censite, Limen non sa quali versanti hanno una storia.
    pericoli: [landslide]
    livello: essenziale
    misura: {colonna: iffi_density_500, informativo: positivi}
    procura_con: make static-data
    fonte: ISPRA IdroGEO — Inventario dei Fenomeni Franosi in Italia
    url: https://idrogeo.isprambiente.it
    # Una licenza per area, tutte CC BY-SA 4.0 (verificate le 21, #406):
    # Licenza_Condizioni_Uso_Inventario_IFFI_ISPRA_<Regione_X>.pdf sul CMS di
    # IdroGEO, non dentro gli ZIP. «Regione» va sostituito con l'ente dell'area.
    licenza: CC BY-SA 4.0
    attribuzione: >-
      ISPRA – Regione, Inventario dei Fenomeni Franosi in Italia (IFFI),
      idrogeo.isprambiente.it
    peso_gb: 0.84

  - id: pai_frana
    nome: pericolosità frana PAI
    a_cosa_serve: >-
      La classe di pericolosità che i Piani di Assetto Idrogeologico assegnano
      a ogni area. Senza, Limen ignora la valutazione ufficiale del territorio.
    pericoli: [landslide]
    livello: essenziale
    misura: {colonna: pai_class_norm, informativo: positivi}
    procura_con: make static-data
    fonte: ISPRA IdroGEO — mosaicatura nazionale PAI frane 2020-2021
    url: https://idrogeo.isprambiente.it
    licenza: CC BY-SA 4.0
    attribuzione: >-
      ISPRA - Mosaicatura nazionale delle aree a pericolosità da frana PAI
      (v. 4.0 – 2020-2021), https://idrogeo.isprambiente.it
    peso_gb: 1.09

  - id: idraulica
    nome: pericolosità idraulica ISPRA
    a_cosa_serve: >-
      Le aree che possono allagarsi, per probabilità alta, media e bassa. Senza,
      ogni cella vale lo stesso valore di riserva e la mappa alluvione è uniforme.
    pericoli: [flood]
    livello: essenziale
    misura: {colonna: flood_hazard_norm, informativo: positivi}
    procura_con: make static-data
    fonte: ISPRA IdroGEO — mosaicatura nazionale della pericolosità idraulica 2020
    url: https://idrogeo.isprambiente.it
    licenza: CC BY-SA 4.0
    attribuzione: >-
      ISPRA - Mosaicatura delle aree a pericolosità idraulica (v. 5.0 – 2020),
      https://idrogeo.isprambiente.it
    peso_gb: 0.70

  - id: dtm
    nome: pendenza (DTM)
    a_cosa_serve: >-
      La pendenza del terreno, ricavata dal modello digitale del terreno a 5 m.
      Senza, la frana non distingue un versante ripido da una pianura e
      l'incendio non sa dove il fuoco risale più in fretta.
    pericoli: [landslide, wildfire]
    livello: essenziale
    misura: {colonna: slope_deg}
    variabile: LIMEN_DEM_RASTER
    procura_con: make static-data
    fonte: IRPI-CNR — HR-DTM Italia 5 m, versione 1.3 (Panza et al., Zenodo)
    url: https://zenodo.org/records/24009736
    licenza: CC-BY 4.0
    attribuzione: Panza et al., CNR-IRPI, HR-DTM of Italy 5 m v1.3, doi:10.5281/zenodo.24009736
    peso_gb: 34.3

  - id: quota_sul_fondo
    nome: quota sul fondo valle
    a_cosa_serve: >-
      Quanti metri la cella sta sopra il punto più basso nel raggio di circa
      tre chilometri. Dentro le aree a pericolo idraulico distingue il fondo
      valle, che si allaga, dal versante, che resta asciutto. Si calcola dal
      modello del terreno.
    pericoli: [flood]
    livello: consigliato
    misura: {colonna: quota_sul_fondo_m}
    deriva_da: dtm
    fonte: calcolata da Limen sul modello del terreno (DTM)
    licenza: come il DTM
    peso_gb: 0

  - id: corine
    nome: copertura del suolo (CORINE)
    a_cosa_serve: >-
      Bosco, macchia, coltivi, città: dice quanto combustibile c'è in ogni
      cella. Senza, l'incendio vale quanto il solo indice meteo FWI.
    pericoli: [wildfire]
    livello: essenziale
    misura: {colonna: landuse_code}
    variabile: LIMEN_CORINE_RASTER
    procura_con: make static-data
    fonte: CORINE Land Cover 2018 (SINAnet / ISPRA)
    url: https://groupware.sinanet.isprambiente.it
    licenza: Copernicus, accesso libero (Reg. UE 1159/2013)
    attribuzione: >-
      Generated using European Union's Copernicus Land Monitoring Service
      information (CORINE Land Cover 2018), distribuiti da ISPRA
    peso_gb: 0.25

  - id: impermeabilizzazione
    nome: suolo impermeabilizzato (CLMS)
    a_cosa_serve: >-
      La percentuale di suolo coperto da asfalto e cemento, dove la pioggia non
      si infiltra e scorre. Senza, le aree urbane sono stimate meno bene.
    pericoli: [flood]
    livello: essenziale
    misura: {colonna: imperviousness_norm, informativo: positivi}
    variabile: LIMEN_IMPERVIOUSNESS_RASTER
    procura_con: make imperviousness-data
    fonte: Copernicus Land Monitoring Service — Imperviousness Density 2018 (EEA)
    url: https://land.copernicus.eu
    licenza: Copernicus, accesso libero (Reg. UE 1159/2013)
    attribuzione: >-
      Generated using European Union's Copernicus Land Monitoring Service
      information (Imperviousness Density 2018)
    peso_gb: 0.005

  - id: comuni
    nome: confini dei comuni (ISTAT)
    a_cosa_serve: >-
      Il comune di ogni cella: senza, la classifica dei comuni resta vuota e gli
      avvisi non dicono dove. Non cambia i punteggi delle celle.
    pericoli: [landslide, flood, wildfire]
    livello: essenziale
    misura: {tabella: comuni}
    procura_con: make static-data
    fonte: ISTAT — Confini delle unità amministrative 2023
    url: https://www.istat.it/it/archivio/222527
    licenza: CC-BY 4.0
    attribuzione: ISTAT, Confini delle unità amministrative a fini statistici
    peso_gb: 0.02

  - id: wui
    nome: interfaccia urbano-bosco
    a_cosa_serve: >-
      Le case che confinano con la vegetazione, dove un incendio diventa una
      minaccia per le persone. Si calcola dalla copertura del suolo.
    pericoli: [wildfire]
    livello: consigliato
    misura: {colonna: wui_proximity_norm, informativo: positivi}
    deriva_da: corine
    fonte: calcolata da Limen su CORINE Land Cover 2018
    licenza: come CORINE
    peso_gb: 0

  - id: vicinanza
    nome: vicinanza ad abitati e infrastrutture
    a_cosa_serve: >-
      Se entro circa due chilometri ci sono case, strade, ferrovie o zone
      industriali. Non cambia il punteggio: decide quale avviso viene prima,
      perché una frana vicino a un paese conta più di una in un bosco.
    pericoli: [landslide, flood, wildfire]
    livello: consigliato
    misura: {colonna: near_urban, conta: veri}
    deriva_da: corine
    fonte: calcolata da Limen su CORINE Land Cover 2018
    licenza: come CORINE
    peso_gb: 0

  - id: strade
    nome: distanza dalla rete stradale
    a_cosa_serve: >-
      Quanto una cella è vicina a strade principali e ferrovie, cioè cosa una
      frana può interrompere. Pesa sull'esposizione, non sul pericolo.
    pericoli: [landslide]
    livello: consigliato
    misura: {colonna: distance_to_road_m}
    variabile: LIMEN_OSM_ROADS
    procura_con: make fetch-static
    fonte: OpenStreetMap (estratto Italia di Geofabrik)
    url: https://www.openstreetmap.org
    licenza: ODbL
    attribuzione: © OpenStreetMap contributors
    peso_gb: 2.0

  - id: litologia
    nome: litologia
    a_cosa_serve: >-
      Il tipo di roccia e di suolo: argille e detriti franano più delle rocce
      compatte. Senza, ogni versante ha la stessa predisposizione.
    pericoli: [landslide]
    livello: essenziale
    misura: {colonna: litho_weight}
    variabile: LIMEN_GEOLOGICAL_SHAPEFILE
    procura_con: make static-data
    fonte: Carta geolitologica d'Italia 1:500.000 (PCN / MASE)
    url: http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/wfs/Carta_geolitologica.map
    licenza: CC-BY 4.0
    attribuzione: Ministero dell'Ambiente e della Sicurezza Energetica, Geoportale Nazionale
    peso_gb: 0.02

  - id: perimetri_effis
    nome: perimetri EFFIS (truth set incendio)
    a_cosa_serve: >-
      Le aree effettivamente bruciate negli anni passati, con cui si verifica
      quanto bene Limen aveva previsto gli incendi. Non entra nel punteggio.
    pericoli: [wildfire]
    livello: avanzato
    misura: {tabella: fire_perimeters}
    procura_con: make static-data
    fonte: EFFIS — European Forest Fire Information System (JRC)
    url: https://effis.jrc.ec.europa.eu
    licenza: CC-BY 4.0
    attribuzione: © European Union, European Forest Fire Information System (EFFIS), Copernicus EMS
    peso_gb: 0.01

  - id: catasti_incendi
    nome: catasti regionali degli incendi (truth set incendio, incendi piccoli)
    a_cosa_serve: >-
      Le aree percorse dal fuoco che le Regioni censiscono per legge, anche
      quelle da un ettaro che EFFIS non vede: Basilicata, Sardegna ed
      Emilia-Romagna. Servono a misurare il backtest sugli incendi piccoli;
      non entrano nel punteggio.
    pericoli: [wildfire]
    livello: avanzato
    misura: {tabella: catasti_incendi}
    procura_con: make static-data
    fonte: >-
      Catasti delle aree percorse dal fuoco (L. 353/2000) — Regione Basilicata
      (RSDI), Regione Sardegna (CFVA), Regione Emilia-Romagna
    url: https://webgis.regione.sardegna.it/scaricocartografiaETL/cfva/
    licenza: IODL 2.0 (Basilicata), CC BY 4.0 (Sardegna, Emilia-Romagna)
    attribuzione: >-
      Regione Basilicata — RSDI; Regione Autonoma della Sardegna — Corpo
      Forestale e di Vigilanza Ambientale; Regione Emilia-Romagna — Catasto
      regionale delle aree percorse dal fuoco
    peso_gb: 0.09

  - id: firms_storico
    nome: storico degli incendi FIRMS (2000 a oggi)
    a_cosa_serve: >-
      Venticinque anni di fuochi rilevati dai satelliti, giorno per giorno: la
      frequenza degli incendi per cella e le etichette dello sfidante ML
      dell'incendio. Il punteggio della mappa non lo usa.
    pericoli: [wildfire]
    livello: avanzato
    misura: {tabella: fire_events}
    procura_con: make static-data
    fonte: NASA FIRMS — archivio per paese (MODIS e VIIRS)
    url: https://firms.modaps.eosdis.nasa.gov/country/
    licenza: CC0 (dati NASA, salvo restrizioni indicate)
    attribuzione: >-
      We acknowledge the use of data from NASA LANCE FIRMS
      (https://earthdata.nasa.gov/firms), part of NASA ESDIS.
    peso_gb: 0.035
