# Soglie di pioggia regionali per l'innesco di frane (#506).
#
# Dati, non configurazione del motore: la produzione usa le curve per
# macroregione di `hazards/landslide.yaml` (e-ITALICA T5). Questo file le
# affianca a quelle pubblicate per regione o zona di allerta, perché il
# backtest le possa confrontare (`LIMEN_BACKTEST_SOGLIE_REGIONALI=1`).
# Ricognizione del 2026-11-12, commento su #506.
#
# Una voce entra solo con parametri numerici pubblicati e una licenza che ne
# consente la trascrizione. Le soglie di Emilia-Romagna (SIGMA), Piemonte
# (SLOPS/DEFENSE), Sardegna, Veneto, Puglia, Lazio e delle altre regioni non
# sono qui: o non sono pubblicate in numeri, o la licenza non è dichiarata.
#
# `forma`:
#   E-D  — E = alpha · D^gamma, pioggia cumulata dell'evento E in mm, durata D
#          in ore (lavori CNR-IRPI). In intensità I = alpha · D^(gamma - 1).
#   I-D  — I = alpha · D^(-beta), intensità I in mm/h.
# `aoi`: le AOI di Limen su cui la soglia vale per intero. Una soglia per zona
# di allerta ha `zona` e nessuna `aoi`: senza le geometrie delle zone il
# backtest non la può ancora applicare, e resta qui come dato.

fonti:
  vennari2014:
    citazione: >-
      Vennari C. et al. (2014), Rainfall thresholds for shallow landslide
      occurrence in Calabria, southern Italy, NHESS 14, 317-330
    url: https://nhess.copernicus.org/articles/14/317/2014/nhess-14-317-2014.pdf
    licenza: CC BY 3.0
  peruccacci2017:
    citazione: >-
      Peruccacci S. et al. (2017), Rainfall thresholds for possible landslide
      occurrence in Italy, Geomorphology 290, 39-57
    url: https://geomorphology.irpi.cnr.it/publications/repository/public/journals/2017/peruccacci-et-al-2017.pdf
    licenza: CC BY 4.0
  segoni2015:
    citazione: >-
      Segoni S. et al. (2015), NHESS 15, 853-861, Tab. 1 (soglie per le zone
      di allerta della Toscana)
    url: https://nhess.copernicus.org/articles/15/853/2015/nhess-15-853-2015.pdf
    licenza: CC BY 3.0
  nocentini2024:
    citazione: >-
      Nocentini N. et al. (2024), Landslides, Tab. 1-2 (soglie per le zone di
      allerta della Liguria)
    url: https://flore.unifi.it/retrieve/b8259e7f-849b-4f9a-9b15-8b4cbc56e38f/Nocentini%20et%20al%20LANDSLIDES%202024%20%282%29.pdf
    licenza: CC BY 4.0

soglie:
  # --- Soglie per regione: le usa la variante del backtest -------------------
  - id: calabria-t5
    aoi: [it-calabria]
    forma: E-D
    alpha: 8.6
    gamma: 0.41
    durata_h: [1, 451]
    livello: T5
    fonte: vennari2014
    nota: Tab. 2, T5,C; incertezze Δα 1,1, Δγ 0,03
  - id: abruzzo-marche-umbria-t5
    aoi: [it-abruzzo, it-marche, it-umbria]
    forma: E-D
    alpha: 7.4
    gamma: 0.38
    durata_h: [1, 1212]
    livello: T5
    fonte: vennari2014
    nota: T5,AMU di Peruccacci et al. 2012, riportata in Vennari 2014 Tab. 2
  - id: sicilia-t5
    aoi: [it-sicilia]
    forma: E-D
    alpha: 9.9
    gamma: 0.30
    durata_h: [1, 252]
    livello: T5
    fonte: peruccacci2017
    nota: Tab. 1, area fisica P7 (Sicilia)

  # --- Soglie per versante o area fisica: dato, non applicate ----------------
  - {id: calabria-tirreno-t5, zona: Calabria versante tirrenico, forma: E-D, alpha: 9.7, gamma: 0.36, livello: T5, fonte: vennari2014}
  - {id: calabria-ionio-t5, zona: Calabria versante ionico, forma: E-D, alpha: 9.0, gamma: 0.50, durata_h: [1, 357], livello: T5, fonte: vennari2014}
  - {id: calabria-t1, zona: Calabria, forma: E-D, alpha: 5.8, gamma: 0.41, livello: T1, fonte: vennari2014}
  - {id: italia-t5, zona: Italia, forma: E-D, alpha: 7.7, gamma: 0.39, durata_h: [1, 1212], livello: T5, fonte: peruccacci2017}
  - {id: alpi-p1-t5, zona: P1 Alpi, forma: E-D, alpha: 6.3, gamma: 0.47, livello: T5, fonte: peruccacci2017}
  - {id: appennino-p4-t5, zona: P4 Appennino, forma: E-D, alpha: 8.6, gamma: 0.36, livello: T5, fonte: peruccacci2017}
