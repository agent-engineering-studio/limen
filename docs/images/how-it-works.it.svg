<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Come funziona Limen</title>
  <desc id="d">Dati aperti su meteo, radar, fiumi, carte del suolo, satelliti e terremoti vengono portati su una griglia di 312.550 celle da un chilometro quadrato che copre l'Italia. Tre motori ne ricavano un punteggio di frana, allagamento e incendio fra 0 e 1, in cinque classi. Il risultato va su una mappa pubblica, negli avvisi, in sintesi scritte dall'AI che non cambiano mai un numero, e su API aperte. Il giro orario, la previsione a 72 ore quattro volte al giorno e il controllo notturno del machine learning lo tengono aggiornato.</desc>
  <style>
    .bg{fill:#fcfcfb}.card{fill:#ffffff;stroke:#d9d8d3}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mute{fill:#8a8984}
    .acc{fill:#eb6834}.accs{stroke:#eb6834}.line{stroke:#b8b7b0}.cell{fill:#e9e8e3}
    .c1{fill:#1f6f78}.c2{fill:#e2c044}.c3{fill:#eb8a2e}.c4{fill:#d6334a}
    .hz-l{fill:#9085e9}.hz-f{fill:#3fb6d3}.hz-w{fill:#e87ba4}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .h{font-size:20px;font-weight:700}.s{font-size:14px}.xs{font-size:12px}.k{font-size:11px;font-weight:700;letter-spacing:.12em}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.mute{fill:#8b949e}
      .acc{fill:#ff8c3a}.accs{stroke:#ff8c3a}.line{stroke:#484f58}.cell{fill:#21262d}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mute"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="16"/>

  <!-- 1 open data -->
  <text class="k acc" x="40" y="48">1 · LEGGE</text>
  <text class="h ink" x="40" y="76">Dati aperti</text>
  <rect class="card" x="40" y="94" width="250" height="356" rx="12"/>
  <g class="s ink">
    <text x="60" y="128">🌧️  Meteo e previsioni</text><text class="xs ink2" x="88" y="146">Open-Meteo · ERA5</text>
    <text x="60" y="180">📡  Radar pioggia</text><text class="xs ink2" x="88" y="198">Protezione Civile (DPC)</text>
    <text x="60" y="232">🌊  Portata dei fiumi</text><text class="xs ink2" x="88" y="250">Copernicus GloFAS</text>
    <text x="60" y="284">⛰️  Suolo e frane storiche</text><text class="xs ink2" x="88" y="302">ISPRA IFFI · PAI · DTM · CORINE</text>
    <text x="60" y="336">🛰️  Satelliti</text><text class="xs ink2" x="88" y="354">NASA FIRMS · EGMS · EFFIS</text>
    <text x="60" y="388">〰️  Terremoti</text><text class="xs ink2" x="88" y="406">INGV</text>
    <text class="xs mute" x="60" y="436">tutti pubblici, tutti a licenza aperta</text>
  </g>
  <line class="line" x1="300" y1="272" x2="340" y2="272" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 grid -->
  <text class="k acc" x="350" y="48">2 · LOCALIZZA</text>
  <text class="h ink" x="350" y="76">Una cella = 1 km²</text>
  <rect class="card" x="350" y="94" width="230" height="356" rx="12"/>
  <g transform="translate(375,118)">
    <g id="row">
      <rect class="cell" x="0" width="18" height="18" rx="2"/><rect class="cell" x="22" width="18" height="18" rx="2"/><rect class="cell" x="44" width="18" height="18" rx="2"/><rect class="cell" x="66" width="18" height="18" rx="2"/><rect class="cell" x="88" width="18" height="18" rx="2"/><rect class="cell" x="110" width="18" height="18" rx="2"/><rect class="cell" x="132" width="18" height="18" rx="2"/><rect class="cell" x="154" width="18" height="18" rx="2"/>
    </g>
    <use href="#row" y="22"/><use href="#row" y="44"/><use href="#row" y="66"/><use href="#row" y="88"/><use href="#row" y="110"/><use href="#row" y="132"/>
    <rect class="c1" x="22" y="44" width="18" height="18" rx="2"/><rect class="c1" x="44" y="66" width="18" height="18" rx="2"/>
    <rect class="c2" x="66" y="66" width="18" height="18" rx="2"/><rect class="c2" x="88" y="44" width="18" height="18" rx="2"/>
    <rect class="c3" x="88" y="66" width="18" height="18" rx="2"/><rect class="c4" x="110" y="66" width="18" height="18" rx="2"/>
    <rect class="c3" x="110" y="88" width="18" height="18" rx="2"/><rect class="c2" x="132" y="88" width="18" height="18" rx="2"/>
    <rect class="c1" x="66" y="110" width="18" height="18" rx="2"/>
  </g>
  <text class="h ink" x="372" y="320">312.550 celle</text>
  <text class="s ink2" x="372" y="344">tutte le 20 regioni italiane</text>
  <text class="s ink2" x="372" y="376">Ogni cella ha la sua</text>
  <text class="s ink2" x="372" y="396">pendenza, il suo suolo,</text>
  <text class="s ink2" x="372" y="416">la sua pioggia.</text>
  <line class="line" x1="590" y1="272" x2="630" y2="272" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 engines -->
  <text class="k acc" x="640" y="48">3 · CALCOLA</text>
  <text class="h ink" x="640" y="76">Tre formule leggibili</text>
  <rect class="card" x="640" y="94" width="250" height="356" rx="12"/>
  <circle class="hz-l" cx="668" cy="128" r="9"/><text class="s ink" x="686" y="133" font-weight="700">Frana</text>
  <text class="xs ink2" x="686" y="152">versante fragile × pioggia forte</text>
  <text class="xs ink2" x="686" y="168">+ terremoti e incendi recenti</text>
  <circle class="hz-f" cx="668" cy="200" r="9"/><text class="s ink" x="686" y="205" font-weight="700">Allagamento</text>
  <text class="xs ink2" x="686" y="224">area allagabile ×</text>
  <text class="xs ink2" x="686" y="240">il più forte fra pioggia e fiume</text>
  <circle class="hz-w" cx="668" cy="272" r="9"/><text class="s ink" x="686" y="277" font-weight="700">Incendio</text>
  <text class="xs ink2" x="686" y="296">indice meteo d'incendio ×</text>
  <text class="xs ink2" x="686" y="312">combustibile e pendenza</text>
  <text class="xs ink2" x="662" y="350">punteggio 0 → 1, cinque classi</text>
  <g transform="translate(662,362)">
    <rect x="0" width="42" height="14" rx="3" class="cell"/><rect x="44" width="42" height="14" rx="3" class="c1"/><rect x="88" width="42" height="14" rx="3" class="c2"/><rect x="132" width="42" height="14" rx="3" class="c3"/><rect x="176" width="42" height="14" rx="3" class="c4"/>
    <g class="mute" font-size="10" text-anchor="middle"><text x="21" y="30">nessuna</text><text x="65" y="30">bassa</text><text x="109" y="30">moderata</text><text x="153" y="30">alta</text><text x="197" y="30">molto alta</text></g>
  </g>
  <text class="xs mute" x="662" y="436">nessuna AI dentro il numero</text>
  <line class="line" x1="900" y1="272" x2="940" y2="272" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 outputs -->
  <text class="k acc" x="950" y="48">4 · CONDIVIDE</text>
  <text class="h ink" x="950" y="76">Aperto a tutti</text>
  <rect class="card" x="950" y="94" width="210" height="356" rx="12"/>
  <g class="s ink">
    <text x="970" y="128">🗺️  Mappa pubblica</text><text class="xs ink2" x="998" y="146">adesso e a +72 ore</text>
    <text x="970" y="196">🔔  Avvisi</text><text class="xs ink2" x="998" y="214">Telegram · e-mail · MQTT</text><text class="xs ink2" x="998" y="230">webhook</text>
    <text x="970" y="280">✍️  Sintesi AI</text><text class="xs ink2" x="998" y="298">spiegano i numeri,</text><text class="xs ink2" x="998" y="314">non li cambiano mai</text>
    <text x="970" y="364">🔌  API aperte</text><text class="xs ink2" x="998" y="382">REST · MCP · A2A</text>
  </g>

  <!-- cadence strip -->
  <rect class="card" x="40" y="474" width="1120" height="62" rx="12"/>
  <text class="k acc" x="62" y="511">RITMO</text>
  <text class="s ink" x="160" y="504" font-weight="700">ogni ora</text><text class="xs ink2" x="160" y="522">punteggi, mappa, avvisi</text>
  <text class="s ink" x="390" y="504" font-weight="700">4 volte al giorno</text><text class="xs ink2" x="390" y="522">previsione a 72 ore per cella</text>
  <text class="s ink" x="620" y="504" font-weight="700">ogni 15–45 min</text><text class="xs ink2" x="620" y="522">pioggia al radar e fuochi da satellite avviano un calcolo</text>
  <text class="s ink" x="960" y="504" font-weight="700">ogni notte</text><text class="xs ink2" x="960" y="522">controllo ML, backup</text>
</svg>
